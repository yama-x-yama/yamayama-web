<style>
/* 銭湯のタイルと暖簾の藍。色は藍と白の二色だけ。
   強い扱いは「料金の数字」と「刺青の札」の二箇所に集め、ほかは静かに置く。
   節ごとに見出しの扱いを変え、同じ型の繰り返しにしない。 */
:root{
  --tile:#eef0ec;          /* 浴場のタイル。クリームではなく、わずかに緑を含んだ白 */
  --tile-deep:#e2e5e0;
  --indigo:#15293d;        /* 暖簾の藍 */
  --indigo-mid:#3d5771;
  --indigo-pale:#5c6e82;
  --rule:#c9cfc8;
  --f-min:"Zen Old Mincho",ui-serif,Georgia,serif;
  --f-num:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --g:max(22px,env(safe-area-inset-left,0px));
  --g-r:max(22px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tile);color:var(--indigo);
  font-family:var(--f-body);font-size:15.5px;line-height:1.95;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
/* ── 露天の一枚。暖簾の下、柱より上に置く。湯気が引いていくように薄く現れる ── */
.yu{margin:0;background:var(--indigo)}
.yu img{width:100%;aspect-ratio:16/9;max-height:58vh;object-fit:cover;object-position:50% 62%}
@media (min-width:900px){.yu img{aspect-ratio:21/9;max-height:none}}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:view()){
    .yu img{animation:mist both;animation-timeline:view();animation-range:entry 0% cover 35%}
    @keyframes mist{from{opacity:.35;filter:saturate(.4)}to{opacity:1;filter:saturate(1)}}
  }
}

/* ── 言語：暖簾の下の小さな札。目立たせすぎない ── */
.noren{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--indigo);color:var(--tile)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:31;background:var(--indigo)}
.noren-in{display:flex;align-items:center;gap:0;padding-left:var(--g);padding-right:var(--g-r);
  max-width:60rem;margin:0 auto}
.noren button{padding:13px 0;margin-right:18px;background:none;border:0;color:rgba(238,240,236,.55);
  font:400 12.5px/1 var(--f-body);cursor:pointer;transition:color .2s ease}
.noren button:last-child{margin-right:0}
.noren button:hover{color:var(--tile)}
.noren button[aria-pressed="true"]{color:var(--tile);text-decoration:underline;text-underline-offset:5px;
  text-decoration-thickness:1.5px}

/* ── 柱：広い画面では左に固定、狭い画面では上に流す ── */
.shell{max-width:60rem;margin:0 auto;padding-left:var(--g);padding-right:var(--g-r)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:17.5rem minmax(0,1fr);gap:0 4rem;align-items:start}
  .post{position:sticky;top:5.5rem;padding-top:4.5rem}
  .post .sign{font-size:33px}
  .body{padding-top:4.5rem;padding-bottom:5rem}
}

/* 柱の中身 */
.post{padding-top:clamp(30px,8vw,48px)}
.where{margin:0 0 10px;font-size:12.5px;letter-spacing:.08em;color:var(--indigo-mid)}
.sign{margin:0;font-family:var(--f-min);font-weight:700;font-size:clamp(31px,9.2vw,40px);
  line-height:1.3;letter-spacing:.01em}
.said{margin:14px 0 0;font-size:14px;line-height:1.95;color:var(--indigo-mid)}
.open{display:flex;align-items:baseline;gap:9px;margin-top:20px;padding-top:14px;
  border-top:1px solid var(--rule);font-size:14px}
.open .lamp{width:7px;height:7px;border-radius:50%;background:var(--indigo-pale);transform:translateY(-2px)}
.open[data-open="true"] .lamp{background:var(--indigo)}
.open b{font-weight:500}
.open span{color:var(--indigo-mid)}

/* ── 冒頭の料金。このページで一番大きいもの ── */
.rate{margin:clamp(30px,7vw,42px) 0 0;padding:0 0 clamp(28px,6vw,36px);border-bottom:2px solid var(--indigo)}
.rate-row{display:flex;align-items:flex-end;gap:12px}
.rate-y{font-family:var(--f-num);font-size:clamp(84px,27vw,132px);font-weight:600;line-height:.8;
  letter-spacing:-.01em}
.rate-y i{font-style:normal;font-size:.42em;font-weight:500;letter-spacing:0;margin-right:.04em;
  vertical-align:.16em;color:var(--indigo-mid)}
.rate-for{padding-bottom:.55em;font-size:14px;line-height:1.5;color:var(--indigo-mid)}
.rate-note{margin:14px 0 0;font-size:13.5px;line-height:1.9;color:var(--indigo-mid)}

/* ── 内訳。数字を左、名前を右。冒頭とは逆の組み ── */
.list{margin:clamp(26px,6vw,34px) 0 0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:0 18px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--rule)}
.list .n{font-family:var(--f-num);font-size:25px;font-weight:600;line-height:1;letter-spacing:.01em}
.list .n.word{font-family:var(--f-body);font-size:14px;font-weight:500;line-height:1.5}
.list .t{font-size:14.5px;line-height:1.7}
.list .t small{display:block;margin-top:1px;font-size:12.5px;line-height:1.7;color:var(--indigo-mid)}

/* 節。見出しの扱いは節ごとに変える */
.sec{margin-top:clamp(44px,10vw,68px)}
.sec-wide{margin-top:clamp(44px,10vw,68px)}
.t-min{margin:0 0 clamp(16px,3.5vw,22px);font-family:var(--f-min);font-weight:600;
  font-size:clamp(20px,5vw,25px);line-height:1.55;letter-spacing:.02em}
.t-run{margin:0 0 14px;font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--indigo-mid)}
.lede{margin:-6px 0 clamp(20px,4vw,26px);font-size:14px;line-height:1.95;color:var(--indigo-mid)}

/* ── 入り方。順番そのものが情報なので番号を大きく出す ── */
.order{margin:0;padding:0;list-style:none;counter-reset:o}
.order li{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:0 14px;
  padding:0 0 clamp(22px,5vw,30px);counter-increment:o}
.order li::before{content:counter(o);font-family:var(--f-min);font-size:30px;font-weight:400;
  line-height:.95;color:var(--indigo-pale)}
.order li:last-child{padding-bottom:0}
.order b{display:block;font-size:16px;font-weight:500;line-height:1.7}
.order p{margin:3px 0 0;font-size:13.5px;line-height:1.95;color:var(--indigo-mid)}

/* ── 刺青の札。ページで唯一の反転。端まで伸ばす ── */
.fuda{position:relative;overflow:hidden;
  margin:clamp(44px,10vw,68px) calc(var(--g) * -1) 0 calc(var(--g) * -1);
  padding:clamp(28px,7vw,40px) var(--g);background:var(--indigo);color:var(--tile)}
.fuda::before{content:"";position:absolute;inset:0;background:var(--tile);transform-origin:bottom center;
  transform:scaleY(0);pointer-events:none}
.fuda > *{position:relative;z-index:1}
@media (min-width:900px){.fuda{margin-left:0;margin-right:calc(var(--g-r) * -1);padding-left:clamp(28px,4vw,40px)}}
.fuda h2{margin:0 0 16px;font-family:var(--f-min);font-weight:600;font-size:clamp(19px,4.6vw,23px);
  line-height:1.6;letter-spacing:.02em}
.fuda p{margin:0;font-size:14.5px;line-height:2;color:rgba(238,240,236,.82)}
.fuda p + p{margin-top:12px}
.fuda strong{display:block;margin-bottom:10px;font-weight:500;font-size:16px;color:var(--tile)}

/* ── 設備・支払い。密に詰めた表。節の中で最も情報密度を上げる ── */
.rows{display:grid;grid-template-columns:6.4rem minmax(0,1fr);margin:0;font-size:14px}
.rows dt{padding:9px 0;border-top:1px solid var(--rule);color:var(--indigo-mid);font-size:13px;line-height:1.85}
.rows dd{margin:0;padding:9px 0;border-top:1px solid var(--rule);line-height:1.85}
@media (max-width:460px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-bottom:0}
  .rows dd{padding-top:1px;border-top:0}
}
.tender{display:flex;flex-wrap:wrap;gap:0 24px;margin:0;padding:0;list-style:none;font-size:14.5px}
.tender li{display:flex;align-items:baseline;gap:7px;padding:7px 0}
.tender .m{font-family:var(--f-num);font-size:16px;font-weight:600}
.tender li[data-ok="0"]{color:var(--indigo-pale)}
.tender li[data-ok="0"] s{text-decoration:line-through}

/* ── 行き方 ── */
.go{display:inline-flex;align-items:center;gap:9px;min-height:50px;margin-top:22px;padding:0 20px;
  border:1.5px solid var(--indigo);color:var(--indigo);font-size:14.5px;font-weight:500;
  text-decoration:none;transition:background-color .25s ease,color .25s ease}
.go:hover{background:var(--indigo);color:var(--tile)}

.tail{margin-top:clamp(44px,10vw,64px);padding:clamp(22px,5vw,28px) 0
  calc(clamp(30px,7vw,44px) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.tail span{display:inline-block;margin-bottom:9px;font-size:11.5px;letter-spacing:.1em;color:var(--indigo-mid)}
.tail p{margin:0;font-size:12.5px;line-height:1.9;color:var(--indigo-mid)}

:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}

/* ── 動き：湯がゆっくり満ちる。要素は浮かせず、下から現れるのは札だけ ── */
@media (prefers-reduced-motion:no-preference){
  .sign,.said,.open{animation:settle .9s cubic-bezier(.22,1,.36,1) both}
  .said{animation-delay:.09s}.open{animation-delay:.17s}
  .rate-y{animation:swell 1.1s cubic-bezier(.16,1,.3,1) both;animation-delay:.12s}
  .rate{animation:rule 1s cubic-bezier(.22,1,.36,1) both;animation-delay:.3s}
  .open[data-open="true"] .lamp{animation:breathe 3.4s ease-in-out infinite}
  @supports (animation-timeline:view()){
    .list li{animation:settle .01s linear both;animation-timeline:view();animation-range:entry 10px entry 170px}
    .order li{animation:settle .01s linear both;animation-timeline:view();animation-range:entry 0 entry 200px}
    .fuda::before{animation:drain linear both;animation-timeline:view();animation-range:entry 0 entry 62%}
    .rows dd,.rows dt{animation:settle .01s linear both;animation-timeline:view();
      animation-range:entry 0 entry 140px}
  }
}
@keyframes settle{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes swell{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rule{from{border-bottom-color:transparent}to{border-bottom-color:var(--indigo)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(21,41,61,.28)}50%{box-shadow:0 0 0 5px rgba(21,41,61,0)}}
/* 湯が下から満ちるように、札の地が現れる。覆いが引いていくだけなので、
   動きが効かない環境でも地は藍のままで、文字は読める */
@keyframes drain{from{transform:scaleY(1)}to{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

function state(){
  const d = new Date(), w = d.getDay(), day = d.getDate();
  if(w === SHUT_WEEKDAY && day >= 15 && day <= 21) return "rest";
  const m = d.getHours()*60 + d.getMinutes();
  return (m >= OPEN_MIN && m < CLOSE_MIN) ? "open" : "shut";
}

function build(t){
  const ls = document.getElementById("list"); ls.textContent = "";
  for(const f of LIST){
    const li = el("li");
    li.appendChild(f.n ? el("span","n","¥"+f.n) : el("span","n word",t.free));
    const d = el("span","t"); d.appendChild(document.createTextNode(t[f.id]));
    d.appendChild(el("small",null,t[f.id+"_s"]));
    li.appendChild(d);
    ls.appendChild(li);
  }

  const od = document.getElementById("order"); od.textContent = "";
  for(const k of ORDER){
    const li = el("li");
    const d = el("div");
    d.appendChild(el("b",null,t[k]));
    d.appendChild(el("p",null,t[k+"_n"]));
    li.appendChild(d);
    od.appendChild(li);
  }

  for(const [id,keys] of [["kit",KIT],["visit",VISIT]]){
    const dl = document.getElementById(id); dl.textContent = "";
    for(const k of keys){ dl.appendChild(el("dt",null,t[k])); dl.appendChild(el("dd",null,t[k+"_v"])); }
  }

  const tn = document.getElementById("tender"); tn.textContent = "";
  for(const p of PAY){
    const li = el("li"); li.dataset.ok = String(p.ok);
    li.appendChild(el("span","m", p.ok ? "○" : "×"));
    li.appendChild(el(p.ok ? "span" : "s", null, t[p.id]));
    tn.appendChild(li);
  }
}

function apply(code){
  const t = T[code];
  for(const n of document.querySelectorAll("[data-k]")){
    const v = t[n.dataset.k];
    if(v == null) continue;
    if(v.indexOf("<br>") >= 0){ n.textContent = ""; v.split("<br>").forEach((part,i)=>{
      if(i) n.appendChild(document.createElement("br"));
      n.appendChild(document.createTextNode(part));
    }); } else { n.textContent = v; }
  }
  build(t);
  const st = state(), box = document.getElementById("open");
  box.dataset.open = String(st === "open");
  document.getElementById("open-text").textContent = st === "open" ? t.s_open : (st === "rest" ? t.s_rest : t.s_shut);
  document.documentElement.lang = code;
  for(const b of document.querySelectorAll("#langbar button")) b.setAttribute("aria-pressed", String(b.dataset.lang === code));
  document.title = t.name;
}

const bar = document.getElementById("langbar");
for(const [code,label] of LANGS){
  const b = el("button",null,label); b.type = "button"; b.dataset.lang = code;
  b.addEventListener("click", ()=>apply(code));
  bar.appendChild(b);
}
apply("ja");
</script>

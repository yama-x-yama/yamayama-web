<title>湯処 あかがね</title>

<style>
/* 日帰り温泉。石と水の濃い色。情報が主役で写真は使わない。
   数字（料金・時間）を大きく、手順とルールを読み違えようがない形で出す。 */
:root{
  --bg:#14161a; --panel:#1b1e24; --line:#2b3037; --line-soft:#232830;
  --ink:#eef1f4; --sub:#9aa4b0; --faint:#6b7480;
  --steam:#7fb8c4; --steam-dim:#2a3f45; --warn:#e0a35c; --warn-dim:#3a2d1c;
  --font-num:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --font-jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --pad:max(20px,env(safe-area-inset-left,0px));
  --pad-r:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-jp);
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.w{max-width:40rem;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad-r)}

/* ── 言語バー：細い罫線の列。既存デモのピル型とは別物にする ── */
.lang{position:sticky;top:0;z-index:30;background:rgba(20,22,26,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.lang .w{display:flex;align-items:stretch;gap:0;padding-left:0;padding-right:0}
.lang button{flex:1;min-height:46px;padding:0 2px;background:none;border:0;border-right:1px solid var(--line-soft);
  color:var(--faint);font:500 12px/1 var(--font-jp);letter-spacing:.02em;cursor:pointer;
  transition:color .25s ease,background-color .25s ease}
.lang button:last-child{border-right:0}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{color:var(--ink);background:var(--panel);
  box-shadow:inset 0 -2px 0 var(--steam)}

/* ── 冒頭：写真を使わず、文字と罫線だけで立ち上げる ── */
.top{padding:clamp(34px,9vw,64px) 0 clamp(26px,6vw,44px);border-bottom:1px solid var(--line)}
.place{margin:0 0 14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.name{margin:0;font-size:clamp(34px,10vw,56px);font-weight:700;letter-spacing:-.01em;line-height:1.18;
  font-feature-settings:"palt"}
.sub{margin:16px 0 0;font-size:15px;line-height:1.9;color:var(--sub)}

/* いま入れるか：罫線で区切った横並び。カードにしない */
.now{display:flex;align-items:stretch;margin-top:clamp(26px,6vw,38px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.now-state{flex:1;padding:16px 16px 16px 0;border-right:1px solid var(--line-soft)}
.now-last{flex:1;padding:16px 0 16px 16px}
.now-k{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.now-v{display:flex;align-items:center;gap:9px;margin-top:6px;font-size:17px;font-weight:700;line-height:1.3}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.now[data-open="true"] .dot{background:var(--steam);box-shadow:0 0 0 4px rgba(127,184,196,.16)}
.now-time{font-family:var(--font-num);font-size:26px;font-weight:600;letter-spacing:.01em;line-height:1.1}

/* ── セクション ── */
section{padding:clamp(34px,8vw,56px) 0;border-bottom:1px solid var(--line)}
.h{margin:0 0 6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--steam)}
.h2{margin:0 0 clamp(18px,4vw,26px);font-size:clamp(21px,5.4vw,28px);font-weight:700;
  letter-spacing:-.01em;line-height:1.45;font-feature-settings:"palt"}
.lede{margin:-8px 0 clamp(20px,4vw,28px);font-size:14.5px;line-height:1.9;color:var(--sub)}

/* 料金：数字を主役にした行組み。表組みの罫線は最小限 */
.fee{margin:0;padding:0;list-style:none}
.fee li{display:flex;align-items:baseline;gap:14px;padding:13px 0;border-top:1px solid var(--line-soft)}
.fee li:first-child{border-top:0;padding-top:0}
.fee-n{flex:1;min-width:0;font-size:15.5px;line-height:1.6}
.fee-n small{display:block;margin-top:2px;font-size:12.5px;line-height:1.7;color:var(--faint)}
.fee-y{flex:none;font-family:var(--font-num);font-size:30px;font-weight:600;line-height:1;letter-spacing:.01em}
.fee-y sup{font-family:var(--font-jp);font-size:11px;font-weight:400;vertical-align:.9em;margin-left:3px;color:var(--faint)}
.fee-free{font-size:16px;font-weight:700;color:var(--steam)}

/* 入浴の手順：番号を罫線の外に出した縦の流れ */
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 clamp(20px,4.5vw,28px) 44px;counter-increment:s}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:-2px;
  font-family:var(--font-num);font-size:22px;font-weight:600;color:var(--steam)}
.steps li::after{content:"";position:absolute;left:11px;top:24px;bottom:4px;width:1px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.steps b{display:block;font-size:16.5px;font-weight:700;line-height:1.6}
.steps p{margin:4px 0 0;font-size:14px;line-height:1.9;color:var(--sub)}

/* タトゥー：見落とされては困るので、唯一の強い囲み */
.rule{padding:clamp(18px,4.5vw,24px);background:var(--warn-dim);border-left:3px solid var(--warn)}
.rule-h{display:block;margin-bottom:8px;font-size:15px;font-weight:700;color:var(--warn)}
.rule p{margin:0;font-size:14.5px;line-height:1.95}
.rule p + p{margin-top:10px}

/* 設備・貸出：2列の素朴な定義リスト */
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:0;margin:0}
.kv dt{padding:11px 0;border-top:1px solid var(--line-soft);font-size:13px;color:var(--faint)}
.kv dd{margin:0;padding:11px 0;border-top:1px solid var(--line-soft);font-size:14.5px;line-height:1.8}
.kv dt:first-of-type,.kv dt:first-of-type + dd{border-top:0}
@media (max-width:420px){
  .kv{grid-template-columns:1fr}
  .kv dt{padding-bottom:0;border-top:1px solid var(--line-soft)}
  .kv dd{padding-top:2px;border-top:0}
  .kv dt:first-of-type + dd{border-top:0}
}

/* 支払い：使える/使えないを色だけに頼らず記号と文字で */
.pay{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.pay li{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);
  font-size:13.5px;line-height:1.4}
.pay li[data-ok="0"]{color:var(--faint);border-style:dashed}
.pay .mk{font-family:var(--font-num);font-size:15px;font-weight:600;color:var(--steam)}
.pay li[data-ok="0"] .mk{color:var(--faint)}
.pay-s{font-size:12px;color:var(--faint)}

/* 行き方：ボタンは固定せず、この節の中に置く */
.go{display:inline-flex;align-items:center;gap:9px;min-height:52px;margin-top:20px;padding:0 22px;
  background:var(--ink);color:var(--bg);font-size:14.5px;font-weight:700;text-decoration:none;
  transition:opacity .25s ease}
.go:hover{opacity:.82}
.tel{font-family:var(--font-num);font-size:26px;font-weight:600;letter-spacing:.02em}

footer{padding:clamp(28px,7vw,44px) 0 calc(clamp(28px,7vw,44px) + env(safe-area-inset-bottom,0px));
  border-bottom:0}
.demo-tag{display:inline-block;margin-bottom:10px;padding:4px 10px;border:1px solid var(--warn);
  color:var(--warn);font-size:11px;letter-spacing:.1em}
footer p{margin:0;font-size:13px;line-height:1.85;color:var(--faint)}

:focus-visible{outline:2px solid var(--steam);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <span data-k="cta_map"></span>
    </a>
  </div>
</section>

</main>

<footer>

let current = "ja";
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

function state(){
  const d = new Date();
  const w = d.getDay(), day = d.getDate();
  /* 第3火曜：その月の3回目の火曜日 */
  if(w === CLOSED_WEEKDAY && day >= 15 && day <= 21) return "closedday";
  const m = d.getHours()*60 + d.getMinutes();
  const o = OPEN_H[0]*60 + OPEN_H[1], c = CLOSE_H[0]*60 + CLOSE_H[1];
  return (m >= o && m < c) ? "open" : "closed";
}

function build(t){
  const fl = document.getElementById("fee-list"); fl.textContent = "";
  for(const f of FEE){
    const li = el("li");
    const n = el("div","fee-n"); n.appendChild(document.createTextNode(t[f.id]));
    n.appendChild(el("small",null,t[f.id+"_s"]));
    li.appendChild(n);
    if(f.y){
      li.appendChild(el("div","fee-y","¥"+f.y));
    } else {
      li.appendChild(el("div","fee-free",t.free));
    }
    fl.appendChild(li);
  }

  const sl = document.getElementById("steps"); sl.textContent = "";
  for(const s of STEP){
    const li = el("li");
    li.appendChild(el("b",null,t[s]));
    li.appendChild(el("p",null,t[s+"_n"]));
    sl.appendChild(li);
  }

  const kv = document.getElementById("kv"); kv.textContent = "";
  for(const k of KV){ kv.appendChild(el("dt",null,t[k])); kv.appendChild(el("dd",null,t[k+"_v"])); }

  const vk = document.getElementById("visit-kv"); vk.textContent = "";
  for(const k of VISIT){ vk.appendChild(el("dt",null,t[k])); vk.appendChild(el("dd",null,t[k+"_v"])); }

  const pl = document.getElementById("pay-list"); pl.textContent = "";
  for(const p of PAY){
    const li = el("li"); li.dataset.ok = String(p.ok);
    li.appendChild(el("span","mk", p.ok ? "○" : "×"));
    li.appendChild(el("span",null,t[p.id]));
    li.appendChild(el("span","pay-s", p.ok ? t.ok : t.ng));
    pl.appendChild(li);
  }
}

function apply(code){
  current = code;
  const t = T[code];
  for(const n of document.querySelectorAll("[data-k]")){ const v = t[n.dataset.k]; if(v != null) n.textContent = v; }
  build(t);
  const st = state();
  const now = document.getElementById("now");
  now.dataset.open = String(st === "open");
  document.getElementById("now-text").textContent =
    st === "open" ? t.s_open : (st === "closedday" ? t.s_closedday : t.s_closed);
  document.documentElement.lang = code;
  for(const b of document.querySelectorAll("#langbar button")) b.setAttribute("aria-pressed", String(b.dataset.lang === code));
  document.title = t.name;
}

const bar = document.getElementById("langbar");
for(const [code,label] of LANGS){
  const b = el("button",null,label); b.type = "button"; b.dataset.lang = code;
  b.addEventListener("click", ()=>apply(code));
  bar.appendChild(b);
}

apply("ja");
</script>

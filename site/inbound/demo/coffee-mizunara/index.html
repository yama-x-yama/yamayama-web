<style>
/* 焙煎の表を組むつもりで作る。罫線は引かず、左の軸をそろえた余白だけで段を切る。
   色は紙と墨の二色。焙煎度の目盛りだけ一段濃い色を使う。
   動きは要素を浮かせず、軸線が引かれることと、文字の濃度が上がることだけ。 */
:root{
  --paper:#fbfaf7;
  --ink:#141414;
  --ink-2:#55524c;
  --ink-3:#8c877f;
  --hair:#ddd9d2;
  --roast:#6b4a2f;       /* 焙煎度の目盛りにだけ使う */
  --f-grot:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gl:max(20px,env(safe-area-inset-left,0px));
  --gr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-jp);
  font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.c{max-width:54rem;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

/* 言語：左の軸にそろえた、ただの行 */
.lg{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:21;background:var(--paper)}
.lg .c{display:flex;gap:16px;padding-top:12px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.lg .c::-webkit-scrollbar{display:none}
.lg button{flex:none;padding:3px 0;background:none;border:0;border-bottom:1.5px solid transparent;
  color:var(--ink-3);font:500 12px/1.6 var(--f-grot);letter-spacing:.04em;cursor:pointer;white-space:nowrap;
  transition:color .2s}
.lg button:hover{color:var(--ink)}
.lg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* 見出し：左の軸に突き当てる。中央寄せはしない */
.head{padding-top:clamp(28px,8vw,56px)}
.loc{margin:0;font:500 11.5px/1.6 var(--f-grot);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nm{margin:10px 0 0;font-size:clamp(30px,8.4vw,46px);font-weight:500;line-height:1.22;letter-spacing:-.015em;
  font-feature-settings:"palt"}
.nm em{display:block;font-family:var(--f-grot);font-style:normal;font-weight:500;
  font-size:.42em;letter-spacing:.02em;color:var(--ink-2);margin-top:.5em}
.tag{margin:18px 0 0;max-width:30em;font-size:14.5px;line-height:1.95;color:var(--ink-2)}

/* 軸線。スクロールで引かれる */
.axis{height:1px;background:var(--hair);margin:clamp(26px,6vw,40px) 0 0;transform-origin:left center}

/* 営業の状態：記号を使わず、文の形で置く */
.now{margin:clamp(22px,5vw,30px) 0 0;font-size:14.5px;line-height:1.9}
.now b{font-weight:500}
.now span{color:var(--ink-2)}

/* 段。見出しの扱いは段ごとに変える */
.blk{margin-top:clamp(40px,10vw,72px)}
.k-side{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:0 20px;align-items:start}
/* 狭い画面では軸のラベルを出さない。見出しの上に小さな英語が並ぶ形にしたくない */
@media (max-width:560px){.k-side{grid-template-columns:minmax(0,1fr)} .k{display:none}}
.k{margin:0;font:500 11.5px/1.9 var(--f-grot);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.big{margin:0 0 clamp(14px,3vw,20px);font-size:clamp(19px,4.6vw,24px);font-weight:500;line-height:1.6;
  letter-spacing:-.01em;font-feature-settings:"palt"}
.note{margin:0;max-width:34em;font-size:14px;line-height:1.95;color:var(--ink-2)}
/* 焙煎機の一枚。軸の右、本文と同じ列に置く。紙の上に貼った図版のように扱う */
.fig{margin:clamp(34px,8vw,52px) 0 0}
.fig img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--hair)}
.fig figcaption{margin-top:9px;font:500 11px/1.7 var(--f-grot);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:view()){
    .fig img{animation:ink both;animation-timeline:view();animation-range:entry 10% cover 30%}
  }
}

/* 豆：焙煎度を目盛りで見せる。表組みの罫線は引かない */
.beans{margin:0;padding:0;list-style:none}
.beans li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 18px;
  padding:clamp(15px,3.4vw,19px) 0;border-bottom:1px solid var(--hair)}
.beans li:first-child{padding-top:0}
.bn{grid-column:1;font-size:16px;font-weight:500;line-height:1.5}
.bo{grid-column:1;font-size:13px;line-height:1.8;color:var(--ink-2)}
.bp{grid-column:2;grid-row:1;font:500 15px/1.5 var(--f-grot);letter-spacing:.01em;white-space:nowrap}
.bq{grid-column:2;grid-row:2;font-size:11.5px;line-height:1.8;color:var(--ink-3);text-align:right;white-space:nowrap}
.scale{grid-column:1 / -1;display:flex;align-items:center;gap:7px;margin-top:8px}
.scale i{width:15px;height:3px;background:var(--hair);transition:background-color .45s ease}
.scale i.on{background:var(--roast)}
.scale span{font:500 10.5px/1 var(--f-grot);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin-left:3px}

/* 飲みもの：2列に詰める */
.drinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:0 28px;margin:0;padding:0;
  list-style:none}
.drinks li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--hair);font-size:14.5px}
.drinks b{font-weight:400}
.drinks span{font:500 14px/1 var(--f-grot);color:var(--ink-2);white-space:nowrap}
.drinks small{display:block;font-size:12px;line-height:1.7;color:var(--ink-3)}

/* 滞在のきまり：番号なしの短い行。手順ではないので番号を振らない */
.stay{margin:0;padding:0;list-style:none}
.stay li{padding:clamp(13px,3vw,17px) 0;border-bottom:1px solid var(--hair)}
.stay b{display:block;font-size:15px;font-weight:500;line-height:1.6}
.stay p{margin:2px 0 0;font-size:13.5px;line-height:1.9;color:var(--ink-2)}

/* 事実の並び */
.facts{display:grid;grid-template-columns:5.5rem minmax(0,1fr);margin:0;font-size:14px}
.facts dt{padding:8px 0;color:var(--ink-3);font-size:12.5px;line-height:1.9}
.facts dd{margin:0;padding:8px 0;line-height:1.9}
@media (max-width:440px){
  .facts{grid-template-columns:minmax(0,1fr)}
  .facts dt{padding-bottom:0}
  .facts dd{padding-top:0}
}
.pays{display:flex;flex-wrap:wrap;gap:6px 20px;margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.pays li{display:flex;align-items:baseline;gap:6px}
.pays li[data-ok="0"]{color:var(--ink-3)}
.pays em{font-family:var(--f-grot);font-style:normal;font-weight:500}

.map{display:inline-block;margin-top:18px;padding-bottom:2px;border-bottom:1.5px solid var(--ink);
  color:var(--ink);font-size:14.5px;text-decoration:none}
.map:hover{color:var(--ink-2);border-bottom-color:var(--ink-2)}

.end{margin-top:clamp(44px,10vw,72px);padding:clamp(20px,5vw,26px) 0
  calc(clamp(30px,7vw,46px) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair)}
.end b{display:block;font:500 11px/1.9 var(--f-grot);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3)}
.end p{margin:6px 0 0;font-size:12.5px;line-height:1.9;color:var(--ink-3)}

:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── 動き：浮かせない。軸線が引かれ、文字の濃度が上がるだけ ── */
@media (prefers-reduced-motion:no-preference){
  .axis{animation:draw .9s cubic-bezier(.22,1,.36,1) both}
  .nm,.tag,.now{animation:ink .8s ease both}
  .tag{animation-delay:.1s}.now{animation-delay:.18s}
  @supports (animation-timeline:view()){
    .blk{animation:ink .01s linear both;animation-timeline:view();animation-range:entry 0 entry 180px}
    .beans li,.stay li{animation:ink .01s linear both;animation-timeline:view();
      animation-range:entry 20px entry 190px}
  }
}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ink{from{opacity:.18}to{opacity:1}}
</style>
</head>

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

function state(){
  const d=new Date(), w=d.getDay();
  if(SHUT.indexOf(w)>=0) return "rest";
  const m=d.getHours()*60+d.getMinutes();
  return (m>=OPEN_MIN && m<CLOSE_MIN) ? "open" : "shut";
}

function build(t){
  const bl=document.getElementById("beans"); bl.textContent="";
  for(const b of BEANS){
    const li=el("li");
    li.appendChild(el("span","bn",t[b.id]));
    li.appendChild(el("span","bp","¥"+b.p));
    li.appendChild(el("span","bo",t[b.id+"_o"]));
    li.appendChild(el("span","bq",t.g_unit));
    const sc=el("div","scale");
    for(let i=1;i<=5;i++){ const bar=el("i"); if(i<=b.r) bar.className="on"; sc.appendChild(bar); }
    sc.appendChild(el("span",null,t.roast));
    li.appendChild(sc);
    bl.appendChild(li);
  }

  const dl=document.getElementById("drinks"); dl.textContent="";
  for(const d of DRINKS){
    const li=el("li");
    const left=el("div");
    left.appendChild(el("b",null,t[d]));
    if(t[d+"_s"]) left.appendChild(el("small",null,t[d+"_s"]));
    li.appendChild(left);
    li.appendChild(el("span",null,t[d+"_p"]));
    dl.appendChild(li);
  }

  const sl=document.getElementById("stay"); sl.textContent="";
  for(const s of STAY){
    const li=el("li");
    li.appendChild(el("b",null,t[s]));
    li.appendChild(el("p",null,t[s+"_n"]));
    sl.appendChild(li);
  }

  const fl=document.getElementById("facts"); fl.textContent="";
  for(const f of FACTS){ fl.appendChild(el("dt",null,t[f])); fl.appendChild(el("dd",null,t[f+"_v"])); }

  const pl=document.getElementById("pays"); pl.textContent="";
  for(const p of PAYS){
    const li=el("li"); li.dataset.ok=String(p.ok);
    li.appendChild(el("em",null,p.ok?"○":"×"));
    li.appendChild(el("span",null,t[p.id]));
    pl.appendChild(li);
  }
}

function apply(code){
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){ const v=t[n.dataset.k]; if(v!=null) n.textContent=v; }
  build(t);
  const st=state();
  document.getElementById("now-t").textContent = st==="open"?t.s_open:(st==="rest"?t.s_rest:t.s_shut);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#lb button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title=t.name;
}

const lb=document.getElementById("lb");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code));
  lb.appendChild(b);
}
apply("ja");
</script>

<title>八幡いちご園</title>

<style>
/* いちご狩りは時間との勝負。30分で何をするかが全部。
   だから時計の残り時間を円で出して、それを画面の軸にする。
   色は温室の白と、いちごの一色だけ。丸いゴシックを使うが、角丸の箱は作らない。
   動きは、時計の円が描かれることと、品種の粒が色づくこと。 */
:root{
  --glass:#fdfcfa;
  --glass-2:#f1efea;
  --soil:#2a2622;
  --soil-2:#5d574f;
  --soil-3:#6b6459;
  --hair:#dedad2;
  --berry:#c8324b;      /* いちご。一色だけ */
  --f-dm:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --f-jp:"Zen Maru Gothic",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gl:max(20px,env(safe-area-inset-left,0px));
  --gr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--glass);color:var(--soil);font-family:var(--f-jp);
  font-size:15px;line-height:1.95;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.c{max-width:46rem;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

.lang{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);
  border-bottom:1px solid var(--hair)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:31;background:var(--glass)}
.lang .c{display:flex;gap:16px;padding-top:12px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.lang .c::-webkit-scrollbar{display:none}
.lang button{flex:none;padding:0;background:none;border:0;color:var(--soil-3);
  font:500 12.5px/1.6 var(--f-jp);cursor:pointer;white-space:nowrap;transition:color .2s}
.lang button:hover{color:var(--soil)}
.lang button[aria-pressed="true"]{color:var(--berry)}

/* 冒頭：時計が主役。左に時計、右に名前 */
.top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 clamp(18px,5vw,30px);
  align-items:center;padding:clamp(28px,7vw,48px) 0 clamp(22px,5vw,32px)}
.clock{width:clamp(96px,27vw,132px);flex:none}
.clock svg{display:block;width:100%;height:auto;transform:rotate(-90deg)}
.clock .trk{fill:none;stroke:var(--hair);stroke-width:7}
.clock .run{fill:none;stroke:var(--berry);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:var(--len,283);stroke-dashoffset:0}
.clock .mid{font:700 19px var(--f-dm);fill:var(--soil);text-anchor:middle;
  transform:rotate(90deg);transform-origin:center}
.farm{margin:0;font-size:12px;letter-spacing:.14em;color:var(--soil-3)}
.nm{margin:8px 0 0;font-size:clamp(26px,7vw,40px);font-weight:700;line-height:1.3;
  letter-spacing:-.01em;font-feature-settings:"palt"}
.open-s{margin:10px 0 0;font-size:13.5px;color:var(--soil-2)}
.open-s b{font-weight:700;color:var(--soil)}
.say{margin:clamp(18px,4vw,24px) 0 0;max-width:30em;font-size:14.5px;line-height:2;color:var(--soil-2)}

/* 30分の中身。時計の針を追うように横一列 */
.mins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:clamp(24px,5.5vw,34px) 0 0;
  border-top:2px solid var(--soil);border-bottom:1px solid var(--hair)}
.mins div{padding:12px 8px 12px 0;border-right:1px solid var(--hair)}
.mins div:last-child{border-right:0;padding-right:0}
.mins b{display:block;font:700 15px/1.3 var(--f-dm);letter-spacing:.01em}
.mins span{display:block;margin-top:3px;font-size:11px;line-height:1.6;color:var(--soil-3)}
@media (max-width:420px){.mins b{font-size:13.5px}.mins span{font-size:10px}}

.sec{margin-top:clamp(36px,9vw,58px)}
.sec h2{margin:0 0 clamp(12px,3vw,18px);font-size:clamp(19px,5vw,25px);font-weight:700;line-height:1.5;
  font-feature-settings:"palt"}
.sec > p{margin:0 0 clamp(14px,3.2vw,20px);max-width:32em;font-size:14px;line-height:2;color:var(--soil-2)}

/* 料金：月で変わるので、表ではなく期間の帯で見せる */
.season{margin:0;padding:0;list-style:none}
.season li{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) auto;gap:0 12px;
  align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.season li:first-child{border-top:1px solid var(--hair)}
.season .mo{font-size:13.5px;font-weight:500;line-height:1.5}
.season .bar{height:10px;background:var(--glass-2)}
.season .bar i{display:block;height:100%;background:var(--berry);opacity:var(--o,1)}
.season .yy{font:700 17px/1.2 var(--f-dm);white-space:nowrap}
.season small{grid-column:1 / -1;margin-top:2px;font-size:11.5px;line-height:1.7;color:var(--soil-3)}

/* 品種：粒の絵と味の違い */
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));
  gap:clamp(14px,3.4vw,22px)}
.kind{min-width:0}
.kind svg{display:block;width:44px;height:auto;margin-bottom:8px}
.kind .bd{fill:var(--glass-2);stroke:var(--berry);stroke-width:1.6}
.kind .bd.on{fill:var(--berry)}
.kind .lf{fill:none;stroke:var(--soil-2);stroke-width:1.6;stroke-linejoin:round}
.kind b{display:block;font-size:16px;font-weight:700;line-height:1.5}
.kind p{margin:3px 0 0;font-size:13px;line-height:1.9;color:var(--soil-2)}
.kind em{display:block;margin-top:5px;font-style:normal;font-size:11.5px;color:var(--soil-3)}

/* きまり。できること・できないことを分けて出す */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));
  gap:clamp(18px,4vw,30px)}
.can h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--berry)}
.cant h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--soil-3)}
.two ul{margin:0;padding:0;list-style:none}
.two li{padding:7px 0 7px 18px;position:relative;font-size:13.5px;line-height:1.85;border-top:1px solid var(--hair)}
.two li:first-child{border-top:0}
.can li::before{content:"";position:absolute;left:0;top:.95em;width:9px;height:9px;background:var(--berry)}
.cant li::before{content:"";position:absolute;left:0;top:1.05em;width:9px;height:1.5px;background:var(--soil-3)}
.cant li{color:var(--soil-2)}

.rows{display:grid;grid-template-columns:6rem minmax(0,1fr);margin:0;font-size:14px}
.rows dt{padding:9px 0;border-top:1px solid var(--hair);color:var(--soil-3);font-size:12.5px;line-height:1.9}
.rows dd{margin:0;padding:9px 0;border-top:1px solid var(--hair);line-height:1.9}
.rows dt:first-of-type,.rows dt:first-of-type + dd{border-top:0}
@media (max-width:440px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-bottom:0;border-top:1px solid var(--hair)}
  .rows dd{padding-top:0;border-top:0}
  .rows dt:first-of-type{border-top:0}
}
.go{display:inline-block;margin-top:20px;padding:13px 24px;background:var(--berry);color:#fff;
  font-size:14.5px;font-weight:700;text-decoration:none;transition:opacity .2s}
.go:hover{opacity:.85}
.go-n{margin:11px 0 0;font-size:12.5px;line-height:1.9;color:var(--soil-3)}

.end{margin-top:clamp(38px,9vw,60px);padding:clamp(20px,5vw,26px) 0
  calc(clamp(28px,7vw,44px) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair)}
.end b{display:block;font:700 11px/1.9 var(--f-dm);letter-spacing:.14em;color:var(--soil-3)}
.end p{margin:6px 0 0;font-size:12.5px;line-height:1.9;color:var(--soil-3)}

:focus-visible{outline:2px solid var(--berry);outline-offset:3px}

/* ── 動き：時計の円が描かれ、粒が色づく。箱は動かさない ── */
@media (prefers-reduced-motion:no-preference){
  .clock .run{animation:tick 1.5s cubic-bezier(.3,1,.4,1) both}
  .nm,.open-s,.say{animation:in .8s ease both}
  .open-s{animation-delay:.08s}.say{animation-delay:.15s}
  @supports (animation-timeline:view()){
    .season .bar i{animation:grow linear both;animation-timeline:view();animation-range:entry 0 entry 45%}
    .kind .bd{animation:ripen linear both;animation-timeline:view();animation-range:entry 10px entry 55%}
    .two li{animation:in .01s linear both;animation-timeline:view();animation-range:entry 0 entry 140px}
  }
}
@keyframes tick{from{stroke-dashoffset:var(--len,283)}to{stroke-dashoffset:var(--off,70)}}
@keyframes grow{from{width:0}to{width:var(--w,60%)}}
@keyframes ripen{from{fill:var(--glass-2)}to{fill:var(--berry)}}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* ハウスの通路。明るい地に明るい写真。縁を立てず、そのまま置く */
.hausu{margin:clamp(20px,5vw,30px) 0 0}
.hausu img{width:100%;aspect-ratio:3/2;max-height:56vh;object-fit:cover;background:var(--glass-2)}
@media (min-width:760px){.hausu img{aspect-ratio:2/1}}
@media (prefers-reduced-motion:no-preference){
  .hausu img{animation:in .9s cubic-bezier(.22,1,.36,1) both}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  </main>
</div>

const BERRY='<svg viewBox="0 0 40 48" aria-hidden="true"><path class="lf" d="M20 11V5M20 8c-4-4-9-4-12-2 2 4 8 6 12 2zm0 0c4-4 9-4 12-2-2 4-8 6-12 2z"/><path class="bd" d="M20 12c8 0 13 6 13 14 0 10-7 18-13 18S7 36 7 26c0-8 5-14 13-14z"/></svg>';
const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

function state(){
  const d=new Date(), w=d.getDay();
  if(SHUT.indexOf(w)>=0) return "rest";
  const m=d.getHours()*60+d.getMinutes();
  return (m>=OPEN_MIN && m<CLOSE_MIN) ? "open" : "shut";
}

function build(t){
  const mn=document.getElementById("mins"); mn.textContent="";
  for(const k of MINS){
    const d=el("div");
    d.appendChild(el("b",null,t[k]));
    d.appendChild(el("span",null,t[k+"_n"]));
    mn.appendChild(d);
  }

  const se=document.getElementById("season"); se.textContent="";
  for(const s of SEASON){
    const li=el("li");
    li.appendChild(el("span","mo",t[s.id]));
    const bar=el("div","bar"); const i=el("i");
    i.style.width=s.w+"%"; i.style.setProperty("--w",s.w+"%"); i.style.setProperty("--o",s.o);
    bar.appendChild(i); li.appendChild(bar);
    li.appendChild(el("span","yy","¥"+s.y));
    li.appendChild(el("small",null,t[s.id+"_v"]+" ／ "+t.per));
    se.appendChild(li);
  }

  const kd=document.getElementById("kinds"); kd.textContent="";
  for(const k of KINDS){
    const d=el("div","kind");
    d.innerHTML=BERRY;
    if(k.on) d.querySelector(".bd").classList.add("on");
    d.appendChild(el("b",null,t[k.id]));
    d.appendChild(el("p",null,t[k.id+"_n"]));
    d.appendChild(el("em",null,t[k.id+"_s"]));
    kd.appendChild(d);
  }

  for(const [id,keys] of [["can",CAN],["cant",CANT]]){
    const ul=document.getElementById(id); ul.textContent="";
    for(const k of keys) ul.appendChild(el("li",null,t[k]));
  }

  const rw=document.getElementById("rows"); rw.textContent="";
  for(const k of ROWS){ rw.appendChild(el("dt",null,t[k])); rw.appendChild(el("dd",null,t[k+"_v"])); }
}

function apply(code){
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){ const v=t[n.dataset.k]; if(v!=null) n.textContent=v; }
  build(t);
  const s=state();
  document.getElementById("st").textContent = s==="open"?t.s_open:(s==="rest"?t.s_rest:t.s_shut);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#lb button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title=t.name;
}

/* 時計の円。全周の約3/4ぶんを塗る */
const run=document.getElementById("run");
try{
  const len=run.getTotalLength();
  run.style.setProperty("--len",len);
  run.style.strokeDasharray=len;
  run.style.setProperty("--off",len*0.22);
  run.style.strokeDashoffset=len*0.22;
}catch(e){}

const lb=document.getElementById("lb");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code));
  lb.appendChild(b);
}
apply("ja");
</script>

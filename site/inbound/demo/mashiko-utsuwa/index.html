<title>器 土と灰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* 器の店。写真がないので、器そのものを断面の線で描く。
   品物を番号で呼ぶ台帳の体裁にして、線画と寸法を主役にする。
   色は土の灰と墨の二色。釉薬の青磁だけ一点使う。
   動きは、器の輪郭線が引かれること。要素は浮かせない。 */
:root{
  --clay:#f7f6f3;
  --clay-2:#eceae5;
  --sumi:#1f1e1c;
  --sumi-2:#5c5953;
  --sumi-3:#938f87;
  --hair:#d8d5ce;
  --seiji:#5c8a86;     /* 青磁。一点だけ */
  --f-ser:"Cormorant Garamond",ui-serif,Georgia,serif;
  --f-jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gl:max(20px,env(safe-area-inset-left,0px));
  --gr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--clay);color:var(--sumi);font-family:var(--f-jp);
  font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.c{max-width:50rem;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

.lang{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--clay);border-bottom:1px solid var(--hair)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:21;background:var(--clay)}
.lang .c{display:flex;justify-content:flex-end;gap:15px;padding-top:11px;padding-bottom:11px;
  overflow-x:auto;scrollbar-width:none}
.lang .c::-webkit-scrollbar{display:none}
.lang button{flex:none;padding:2px 0;background:none;border:0;color:var(--sumi-3);
  font:400 12.5px/1.6 var(--f-jp);cursor:pointer;white-space:nowrap;transition:color .2s}
.lang button:hover{color:var(--sumi)}
.lang button[aria-pressed="true"]{color:var(--seiji)}

/* 扉。欧文のセリフと和文を縦に積む */
.door{padding:clamp(34px,10vw,70px) 0 clamp(26px,6vw,40px)}
.kiln{margin:0;font-family:var(--f-ser);font-size:clamp(13px,3.4vw,15px);font-weight:500;
  letter-spacing:.3em;text-transform:uppercase;color:var(--sumi-3)}
.title{margin:14px 0 0;font-size:clamp(32px,9vw,50px);font-weight:500;line-height:1.2;
  letter-spacing:.06em;font-feature-settings:"palt"}
.intro{margin:20px 0 0;max-width:30em;font-size:14.5px;line-height:2;color:var(--sumi-2)}
.open-line{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--hair);font-size:14px;color:var(--sumi-2)}
.open-line b{color:var(--sumi);font-weight:500}

/* 台帳。番号・線画・寸法・値。品物は順番ではないので数字は符号として扱う */
.ledger{margin:0;padding:0;list-style:none;border-top:1px solid var(--hair)}
.item{display:grid;grid-template-columns:4.8rem minmax(0,1fr);gap:0 18px;
  padding:clamp(22px,5vw,30px) 0;border-bottom:1px solid var(--hair)}
.fig{grid-column:1;grid-row:1 / span 3}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .ln{fill:none;stroke:var(--sumi);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.fig .gl{fill:none;stroke:var(--seiji);stroke-width:1.4;stroke-linecap:round}
.no{grid-column:2;margin:0;font-family:var(--f-ser);font-size:13px;font-weight:500;letter-spacing:.22em;
  color:var(--sumi-3)}
.it-n{grid-column:2;margin:3px 0 0;font-size:17px;font-weight:500;line-height:1.55}
.it-b{grid-column:2;margin:6px 0 0;font-size:13.5px;line-height:1.95;color:var(--sumi-2)}
.spec{grid-column:2;display:flex;flex-wrap:wrap;gap:3px 18px;margin:10px 0 0;padding:0;list-style:none;
  font-size:12.5px;line-height:1.85;color:var(--sumi-3)}
.spec b{font-weight:400;color:var(--sumi-2)}
.price{grid-column:2;margin:9px 0 0;font-family:var(--f-ser);font-size:21px;font-weight:600;letter-spacing:.02em}

/* 段。この店では見出しを横に寝かせず、短い一行で置く */
.part{margin-top:clamp(40px,10vw,66px)}
.part > h2{margin:0 0 clamp(14px,3.4vw,20px);font-size:clamp(18px,4.4vw,22px);font-weight:500;
  line-height:1.6;letter-spacing:.04em;font-feature-settings:"palt"}
.part > p{margin:0;max-width:34em;font-size:14px;line-height:2;color:var(--sumi-2)}

/* 送ることと税。土産物で外国の方が必ず聞くところ */
.ship{margin:clamp(18px,4vw,24px) 0 0;padding:clamp(18px,4.4vw,26px);background:var(--clay-2)}
.ship h3{margin:0 0 10px;font-size:15px;font-weight:500;line-height:1.6}
.ship p{margin:0;font-size:13.5px;line-height:1.95;color:var(--sumi-2)}
.ship p + p{margin-top:9px}
.ship b{font-weight:500;color:var(--sumi)}

.rows{display:grid;grid-template-columns:5.8rem minmax(0,1fr);margin:0;font-size:14px}
.rows dt{padding:8px 0;border-top:1px solid var(--hair);color:var(--sumi-3);font-size:12.5px;line-height:1.9}
.rows dd{margin:0;padding:8px 0;border-top:1px solid var(--hair);line-height:1.9}
.rows dt:first-of-type,.rows dt:first-of-type + dd{border-top:0}
@media (max-width:440px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-bottom:0;border-top:1px solid var(--hair)}
  .rows dd{padding-top:0;border-top:0}
  .rows dt:first-of-type{border-top:0}
}
.tender{display:flex;flex-wrap:wrap;gap:4px 18px;margin:12px 0 0;padding:0;list-style:none;font-size:14px}
.tender li{display:flex;align-items:baseline;gap:6px}
.tender li[data-ok="0"]{color:var(--sumi-3)}
.tender i{font-style:normal;font-family:var(--f-ser);font-weight:600}

.to-map{display:inline-block;margin-top:20px;padding:11px 20px;border:1px solid var(--sumi);
  color:var(--sumi);font-size:14px;text-decoration:none;transition:background-color .25s,color .25s}
.to-map:hover{background:var(--sumi);color:var(--clay)}

.colophon{margin-top:clamp(40px,9vw,64px);padding:clamp(20px,5vw,26px) 0
  calc(clamp(28px,7vw,44px) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair)}
.colophon b{display:block;font-family:var(--f-ser);font-size:12px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--sumi-3)}
.colophon p{margin:7px 0 0;font-size:12.5px;line-height:1.9;color:var(--sumi-3)}

:focus-visible{outline:2px solid var(--seiji);outline-offset:3px}

/* ── 動き：器の輪郭が引かれる。要素は動かさない ── */
@media (prefers-reduced-motion:no-preference){
  .fig .ln,.fig .gl{stroke-dasharray:var(--len,260);stroke-dashoffset:var(--len,260);
    animation:trace 1.1s cubic-bezier(.3,1,.4,1) forwards}
  .fig .gl{animation-delay:.35s}
  @supports (animation-timeline:view()){
    .item .fig .ln,.item .fig .gl{animation-timeline:view();animation-range:entry 0 entry 260px;
      animation-duration:1ms;animation-delay:0s}
  }
  .title,.intro,.open-line{animation:rise .75s cubic-bezier(.22,1,.36,1) both}
  .intro{animation-delay:.07s}.open-line{animation-delay:.14s}
}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
/* <b> だけを許す簡単な差し込み。属性は一切通さない */
function rich(node,s){
  node.textContent="";
  s.split(/(<b>.*?<\/b>)/g).forEach(part=>{
    if(!part) return;
    const m=part.match(/^<b>(.*)<\/b>$/);
    if(m) node.appendChild(el("b",null,m[1]));
    else node.appendChild(document.createTextNode(part));
  });
}

function state(){
  const d=new Date(), w=d.getDay();
  if(SHUT.indexOf(w)>=0) return "rest";
  const m=d.getHours()*60+d.getMinutes();
  return (m>=OPEN_MIN && m<CLOSE_MIN) ? "open" : "shut";
}

function build(t){
  const lg=document.getElementById("ledger"); lg.textContent="";
  for(const it of ITEMS){
    const li=el("li","item");
    const fig=el("div","fig"); fig.innerHTML=SHAPES[it.sh];
    li.appendChild(fig);
    li.appendChild(el("p","no",it.no));
    li.appendChild(el("p","it-n",t[it.id]));
    li.appendChild(el("p","it-b",t[it.id+"_b"]));
    const sp=el("ul","spec");
    for(let i=1;i<=4;i++){ const v=t[it.id+"_s"+i]; if(v) sp.appendChild(el("li",null,v)); }
    li.appendChild(sp);
    li.appendChild(el("p","price","¥"+it.p));
    lg.appendChild(li);
  }
  /* 線の長さを測って、引く動きの距離にする */
  for(const p of document.querySelectorAll(".fig path")){
    try{ p.style.setProperty("--len", Math.ceil(p.getTotalLength())); }catch(e){}
  }

  const rw=document.getElementById("rows"); rw.textContent="";
  for(const k of ROWS){ rw.appendChild(el("dt",null,t[k])); rw.appendChild(el("dd",null,t[k+"_v"])); }

  const tn=document.getElementById("tender"); tn.textContent="";
  for(const p of PAY){
    const li=el("li"); li.dataset.ok=String(p.ok);
    li.appendChild(el("i",null,p.ok?"○":"×"));
    li.appendChild(el("span",null,t[p.id]));
    tn.appendChild(li);
  }
}

function apply(code){
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){
    const v=t[n.dataset.k]; if(v==null) continue;
    if(v.indexOf("<b>")>=0) rich(n,v); else n.textContent=v;
  }
  build(t);
  const st=state();
  document.getElementById("st").textContent = st==="open"?t.s_open:(st==="rest"?t.s_rest:t.s_shut);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#lb button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title=t.name;
}

const lb=document.getElementById("lb");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code));
  lb.appendChild(b);
}
apply("ja");
</script>

<style>
/* 体験は「申し込む前に決めること」が全部。だから二つのプランを横に並べて比べられる形にする。
   いちばん効くのは、作ったものがいつ手に届くかの図。ここだけ図版にして大きく出す。
   色は生の粘土の灰と窯の火の色。火の色は焼成の図にだけ使う。 */
:root{
  --clay:#ece7dc;
  --clay-d:#ded7c8;
  --ink:#232019;
  --ink-2:#5f594e;
  --ink-3:#6c6658;
  --rule:#cfc8ba;
  --kiln:#b8491f;        /* 窯の火。焼成の図にだけ */
  --f-gro:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gl:max(20px,env(safe-area-inset-left,0px));
  --gr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--clay);color:var(--ink);font-family:var(--f-jp);
  font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.c{max-width:52rem;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

.lang{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--clay-d)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:21;background:var(--clay-d)}
.lang .c{display:flex;gap:0;padding:0;overflow-x:auto;scrollbar-width:none}
.lang .c::-webkit-scrollbar{display:none}
.lang button{flex:none;padding:12px 14px;background:none;border:0;color:var(--ink-3);
  font:500 12.5px/1.5 var(--f-jp);cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--clay);color:var(--ink)}

.top{padding:clamp(30px,8vw,56px) 0 clamp(24px,5vw,34px)}
.where{margin:0;font:500 11.5px/1.6 var(--f-gro);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.h1{margin:12px 0 0;font-size:clamp(28px,7.6vw,44px);font-weight:700;line-height:1.3;letter-spacing:-.01em;
  font-feature-settings:"palt"}
.sub{margin:16px 0 0;max-width:30em;font-size:14.5px;line-height:2;color:var(--ink-2)}

/* 二つのプランは、カードを二枚並べるのではなく一枚の対照表にする。
   見るべきは差であって、箱ではない */
.ptable{width:100%;margin:clamp(24px,5.6vw,34px) 0 0;border-collapse:collapse;
  table-layout:fixed;font-size:13.5px}
.ptable th,.ptable td{padding:clamp(9px,2.2vw,12px) 0;border-bottom:1px solid var(--rule);
  text-align:left;vertical-align:top;line-height:1.8}
.ptable th[scope="col"]{padding-bottom:clamp(12px,2.8vw,16px);border-bottom:2px solid var(--ink);
  font-size:17px;font-weight:700;line-height:1.45}
.ptable th[scope="row"]{width:4.6rem;padding-right:10px;font-size:12px;font-weight:400;
  color:var(--ink-3);white-space:nowrap}
.ptable td{padding-right:14px}
.ptable td:last-child{padding-right:0}
.ptable .yen{font:600 clamp(23px,6.4vw,30px)/1.1 var(--f-gro);letter-spacing:-.01em;display:block}
.ptable .per{display:block;margin-top:3px;font-size:11.5px;line-height:1.7;color:var(--ink-3)}
.ptable .lead{font-size:13px;line-height:1.9;color:var(--ink-2)}
@media (max-width:430px){
  .ptable th[scope="row"]{width:3.9rem;font-size:11.5px}
  .ptable{font-size:12.5px}
}

.sec{margin-top:clamp(40px,9vw,64px)}
.sec h2{margin:0 0 clamp(14px,3.2vw,20px);font-size:clamp(19px,4.6vw,24px);font-weight:700;
  line-height:1.55;font-feature-settings:"palt"}
.sec > p{margin:0;max-width:34em;font-size:14px;line-height:2;color:var(--ink-2)}

/* 届くまでの図。ここだけ火の色を使い、大きく出す */
.kilnmap{margin:clamp(18px,4vw,26px) 0 0;padding:clamp(20px,4.6vw,28px);background:var(--clay-d)}
.kilnmap svg{display:block;width:100%;height:auto;overflow:visible}
.kilnmap .trk{fill:none;stroke:var(--ink-3);stroke-width:1.5}
.kilnmap .hot{fill:none;stroke:var(--kiln);stroke-width:3;stroke-linecap:round}
.kilnmap .nd{fill:var(--clay-d);stroke:var(--ink);stroke-width:1.5}
.kilnmap .nd-hot{fill:var(--kiln);stroke:var(--kiln)}
.kilnmap text{font:500 9.5px var(--f-jp);fill:var(--ink-2)}
.kilnmap text.w{font-family:var(--f-gro);font-weight:600;font-size:10px;fill:var(--ink)}
.kiln-n{margin:14px 0 0;font-size:13.5px;line-height:1.95;color:var(--ink-2)}
.kiln-n b{font-weight:500;color:var(--ink)}

/* 当日の流れ。番号ではなく経過時間で示す */
.flow{margin:0;padding:0;list-style:none}
.flow li{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:0 16px;padding:clamp(11px,2.6vw,15px) 0;
  border-bottom:1px solid var(--rule)}
.flow li:first-child{border-top:1px solid var(--rule)}
.flow .mn{font:500 13px/1.7 var(--f-gro);letter-spacing:.02em;color:var(--ink-3)}
.flow b{font-size:15px;font-weight:500;line-height:1.7}
.flow p{grid-column:2;margin:1px 0 0;font-size:13px;line-height:1.9;color:var(--ink-2)}

.bring{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}
.bring li{padding:7px 13px;background:var(--clay-d);font-size:13px;line-height:1.5}
.bring li[data-no="1"]{background:none;border:1px dashed var(--rule);color:var(--ink-3)}

.rows{display:grid;grid-template-columns:6.4rem minmax(0,1fr);margin:0;font-size:14px}
.rows dt{padding:9px 0;border-top:1px solid var(--rule);color:var(--ink-3);font-size:12.5px;line-height:1.9}
.rows dd{margin:0;padding:9px 0;border-top:1px solid var(--rule);line-height:1.9}
.rows dt:first-of-type,.rows dt:first-of-type + dd{border-top:0}
@media (max-width:450px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-bottom:0;border-top:1px solid var(--rule)}
  .rows dd{padding-top:0;border-top:0}
  .rows dt:first-of-type{border-top:0}
}
.cta{display:inline-block;margin-top:20px;padding:14px 24px;background:var(--ink);color:var(--clay);
  font-size:14.5px;font-weight:500;text-decoration:none;transition:opacity .25s}
.cta:hover{opacity:.82}
.cta-n{margin:12px 0 0;font-size:12.5px;line-height:1.9;color:var(--ink-3)}

.end{margin-top:clamp(40px,9vw,64px);padding:clamp(20px,5vw,26px) 0
  calc(clamp(28px,7vw,44px) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.end b{display:block;font:600 11px/1.9 var(--f-gro);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.end p{margin:6px 0 0;font-size:12.5px;line-height:1.9;color:var(--ink-3)}

:focus-visible{outline:2px solid var(--kiln);outline-offset:3px}

/* ── 動き：窯の線に火が通る。プランは動かさない ── */
@media (prefers-reduced-motion:no-preference){
  .kilnmap .hot{stroke-dasharray:var(--len,300);stroke-dashoffset:var(--len,300);
    animation:fire 1.6s cubic-bezier(.4,0,.2,1) forwards}
  .h1,.sub{animation:up .7s cubic-bezier(.22,1,.36,1) both}
  .sub{animation-delay:.08s}
  @supports (animation-timeline:view()){
    .kilnmap .hot{animation-timeline:view();animation-range:entry 40px entry 320px;animation-duration:1ms}
    .flow li{animation:up .01s linear both;animation-timeline:view();animation-range:entry 10px entry 160px}
  }
}
@keyframes fire{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 轆轤の手。見出しと料金表のあいだに、作業の写真を一枚だけ挟む */
.te{margin:0 0 clamp(26px,6vw,38px)}
.te img{width:100%;aspect-ratio:3/2;object-fit:cover;object-position:50% 45%;background:var(--clay)}
.tana{margin:clamp(20px,5vw,30px) 0 0}
.tana img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--clay)}
@media (prefers-reduced-motion:no-preference){
  .te img{animation:up .9s cubic-bezier(.22,1,.36,1) both}
}
</style>
</head>

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
function rich(node,s){
  node.textContent="";
  s.split(/(<b>.*?<\/b>)/g).forEach(part=>{
    if(!part) return;
    const m=part.match(/^<b>(.*)<\/b>$/);
    if(m) node.appendChild(el("b",null,m[1]));
    else node.appendChild(document.createTextNode(part));
  });
}

function build(t){
  /* プランの対照表。左に項目名、右に2つのプランを並べる */
  const tb=document.getElementById("ptable"); tb.textContent="";
  const head=document.createElement("thead"), hr=document.createElement("tr");
  hr.appendChild(el("td"));
  for(const p of PLANS){ const th=el("th",null,t[p.id]); th.scope="col"; hr.appendChild(th); }
  head.appendChild(hr); tb.appendChild(head);

  const tbody=document.createElement("tbody");
  const money=document.createElement("tr");
  money.appendChild(el("td"));
  for(const p of PLANS){
    const td=document.createElement("td");
    td.appendChild(el("span","yen","¥"+p.y));
    td.appendChild(el("span","per",t.unit));
    money.appendChild(td);
  }
  tbody.appendChild(money);

  const lead=document.createElement("tr");
  lead.appendChild(el("td"));
  for(const p of PLANS) lead.appendChild(el("td","lead",t[p.id+"_b"]));
  tbody.appendChild(lead);

  for(let i=1;i<=4;i++){
    const tr=document.createElement("tr");
    const th=el("th",null,t[PLANS[0].id+"_s"+i]); th.scope="row"; tr.appendChild(th);
    for(const p of PLANS) tr.appendChild(el("td",null,t[p.id+"_s"+i+"v"]));
    tbody.appendChild(tr);
  }
  tb.appendChild(tbody);

  const fl=document.getElementById("flow"); fl.textContent="";
  for(const f of FLOW){
    const li=el("li");
    li.appendChild(el("span","mn",f.m));
    li.appendChild(el("b",null,t[f.k]));
    li.appendChild(el("p",null,t[f.k+"_n"]));
    fl.appendChild(li);
  }

  const br=document.getElementById("bring"); br.textContent="";
  for(const g of BRING){
    const li=el("li",null,t[g.k]);
    if(g.no) li.dataset.no="1";
    br.appendChild(li);
  }

  const rw=document.getElementById("rows"); rw.textContent="";
  for(const k of ROWS){ rw.appendChild(el("dt",null,t[k])); rw.appendChild(el("dd",null,t[k+"_v"])); }

  const h=document.getElementById("hotline");
  try{ h.style.setProperty("--len", Math.ceil(h.getTotalLength())); }catch(e){}
}

function apply(code){
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){
    const v=t[n.dataset.k]; if(v==null) continue;
    if(v.indexOf("<b>")>=0) rich(n,v); else n.textContent=v;
  }
  build(t);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#lb button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title=t.name;
}

const lb=document.getElementById("lb");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code));
  lb.appendChild(b);
}
apply("ja");
</script>

<meta name="theme-color" content="#121212">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>青竹 とみや</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* ラーメン屋は貼り紙とのれんの世界。だから紙に刷ったポスターのつもりで組む。
   太い文字と墨と一色の赤。写真はないので、文字の大きさそのものが絵になる。
   いちばん詰まるのは券売機なので、そこだけ図にして大きく出す。
   動きは、刷り上がるように文字が下からめくれて出ること。 */
:root{
  --black:#121212;
  --black-2:#1e1e1e;
  --white:#f5f2eb;      /* わずかに黄ばんだ紙 */
  --white-2:#bdb8ae;
  --white-3:#8b867d;
  --red:#c22a20;        /* のれんの赤。地に敷く用。白文字がのる */
  --red-ink:#ee6055;    /* 同じ赤を、黒地の上の小さな文字用に明るくしたもの */
  --line:#333;
  --f-imp:"Anton",ui-sans-serif,system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gl:max(18px,env(safe-area-inset-left,0px));
  --gr:max(18px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--f-jp);
  font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.c{max-width:44rem;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

.lang{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--red)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:31;background:var(--red)}
.lang .c{display:flex;gap:0;padding:0;overflow-x:auto;scrollbar-width:none}
.lang .c::-webkit-scrollbar{display:none}
.lang button{flex:none;padding:11px 13px;background:none;border:0;color:rgba(245,242,235,.66);
  font:700 12.5px/1.5 var(--f-jp);cursor:pointer;white-space:nowrap;transition:color .18s,background-color .18s}
.lang button:hover{color:var(--white)}
.lang button[aria-pressed="true"]{background:var(--black);color:var(--white)}

/* のれん。大きな文字が絵の代わり */
.noren{padding:clamp(30px,8vw,56px) 0 clamp(24px,5vw,34px);text-align:left}
.tgt{margin:0;font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--red-ink)}
.shop{margin:10px 0 0;font-size:clamp(44px,15vw,92px);font-weight:900;line-height:.98;
  letter-spacing:-.03em;font-feature-settings:"palt"}
.shop span{display:block;color:var(--red-ink)}
.roman{margin:12px 0 0;font-family:var(--f-imp);font-size:clamp(14px,3.6vw,18px);letter-spacing:.12em;
  color:var(--white-3)}
.say{margin:18px 0 0;max-width:26em;font-size:14.5px;line-height:1.95;color:var(--white-2)}
.open-now{display:inline-block;margin:20px 0 0;padding:7px 14px;border:2px solid var(--white);
  font-size:14px;font-weight:700}
.open-now[data-open="false"]{border-color:var(--white-3);color:var(--white-3)}
.open-sub{margin:10px 0 0;font-size:13px;color:var(--white-3)}

/* 券売機。ここが外国の方のいちばんの関門なので、図にして大きく */
.kiosk{margin:clamp(34px,9vw,56px) 0 0;padding:clamp(20px,5vw,30px);background:var(--white);color:var(--black)}
.kiosk h2{margin:0 0 6px;font-size:clamp(21px,5.6vw,27px);font-weight:900;line-height:1.4;
  letter-spacing:-.01em}
.kiosk .k-lede{margin:0 0 clamp(16px,3.6vw,22px);font-size:13.5px;line-height:1.9;color:#4a4740}
.steps{margin:0;padding:0;list-style:none;counter-reset:k}
.steps li{display:grid;grid-template-columns:2.1rem minmax(0,1fr);gap:0 12px;
  padding:0 0 clamp(14px,3.4vw,18px);counter-increment:k}
.steps li::before{content:counter(k);font-family:var(--f-imp);font-size:25px;line-height:.95;color:var(--red)}
.steps li:last-child{padding-bottom:0}
.steps b{grid-column:2;display:block;font-size:15.5px;font-weight:700;line-height:1.6}
.steps p{grid-column:2;margin:2px 0 0;font-size:13px;line-height:1.9;color:#4a4740}
.machine{margin:clamp(16px,3.6vw,22px) 0 0}
.machine svg{display:block;width:100%;max-width:300px;height:auto}
.machine .fr{fill:none;stroke:var(--black);stroke-width:2}
.machine .btn{fill:#e9e5db;stroke:var(--black);stroke-width:1.2}
.machine .btn-hi{fill:var(--red);stroke:var(--red)}
.machine .slot{fill:var(--black)}
.machine text{font:700 8px var(--f-jp);fill:var(--black)}
.machine text.w{fill:var(--white)}
.machine text.lb{font-weight:400;font-size:7.5px;fill:#6a675f}

/* 品。値段を大きく、名前を太く。写真の代わりに文字で見せる */
.bowls{margin:0;padding:0;list-style:none}
.bowl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;
  padding:clamp(16px,3.8vw,21px) 0;border-bottom:1px solid var(--line)}
.bowl:first-child{border-top:1px solid var(--line)}
.bw-n{grid-column:1;font-size:19px;font-weight:700;line-height:1.45}
.bw-d{grid-column:1;font-size:13px;line-height:1.85;color:var(--white-2)}
.bw-y{grid-column:2;grid-row:1 / span 2;font-family:var(--f-imp);font-size:27px;line-height:1.1;
  letter-spacing:.01em;white-space:nowrap}
.bw-t{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bw-t span{padding:3px 9px;border:1px solid var(--line);font-size:11.5px;line-height:1.6;color:var(--white-2)}
.bw-t span.pork{border-color:var(--red-ink);color:var(--red-ink)}

.sec{margin-top:clamp(36px,9vw,58px)}
.sec h2{margin:0 0 clamp(12px,3vw,18px);font-size:clamp(19px,5vw,25px);font-weight:900;line-height:1.45;
  letter-spacing:-.01em}
.sec > p{margin:0 0 clamp(14px,3.2vw,20px);max-width:32em;font-size:14px;line-height:1.95;color:var(--white-2)}

/* 量の目安。棒で見せる */
.sizes{margin:0;padding:0;list-style:none}
.sizes li{display:grid;grid-template-columns:4.4rem 1fr auto;gap:0 12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line)}
.sizes b{font-size:14.5px;font-weight:700}
.sizes .bar{height:9px;background:var(--line)}
.sizes .bar i{display:block;height:100%;background:var(--red-ink)}
.sizes small{font-size:12px;color:var(--white-3);white-space:nowrap}

.rules{margin:0;padding:0;list-style:none}
.rules li{padding:clamp(11px,2.6vw,14px) 0;border-bottom:1px solid var(--line)}
.rules b{display:block;font-size:15px;font-weight:700;line-height:1.65}
.rules p{margin:2px 0 0;font-size:13px;line-height:1.9;color:var(--white-2)}

.rows{display:grid;grid-template-columns:5.6rem minmax(0,1fr);margin:0;font-size:14px}
.rows dt{padding:9px 0;border-top:1px solid var(--line);color:var(--white-3);font-size:12.5px;line-height:1.85}
.rows dd{margin:0;padding:9px 0;border-top:1px solid var(--line);line-height:1.85}
.rows dt:first-of-type,.rows dt:first-of-type + dd{border-top:0}
@media (max-width:430px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-bottom:0;border-top:1px solid var(--line)}
  .rows dd{padding-top:0;border-top:0}
  .rows dt:first-of-type{border-top:0}
}
.go{display:inline-block;margin-top:20px;padding:14px 24px;background:var(--red);color:var(--white);
  font-size:14.5px;font-weight:700;text-decoration:none;transition:opacity .2s}
.go:hover{opacity:.85}

.end{margin-top:clamp(38px,9vw,60px);padding:clamp(20px,5vw,26px) 0
  calc(clamp(28px,7vw,44px) + env(safe-area-inset-bottom,0px));border-top:2px solid var(--red-ink)}
.end b{display:block;font-family:var(--f-imp);font-size:12px;letter-spacing:.14em;color:var(--red-ink)}
.end p{margin:7px 0 0;font-size:12.5px;line-height:1.9;color:var(--white-3)}

:focus-visible{outline:2px solid var(--red-ink);outline-offset:3px}

/* ── 動き：刷り上がるように下からめくれて出る。ほかは動かさない ── */
@media (prefers-reduced-motion:no-preference){
  .shop,.roman,.say,.open-now{animation:press .75s cubic-bezier(.2,.9,.3,1) both}
  .roman{animation-delay:.07s}.say{animation-delay:.13s}.open-now{animation-delay:.2s}
  @supports (animation-timeline:view()){
    .bowl,.rules li{animation:press .01s linear both;animation-timeline:view();
      animation-range:entry 10px entry 170px}
    .sizes .bar i{animation:fill linear both;animation-timeline:view();animation-range:entry 0 entry 50%}
    .machine .btn-hi{animation:blink 1.4s steps(1) infinite}
  }
}
@keyframes press{from{opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(6px)}
  to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes fill{from{width:0}to{width:var(--w,50%)}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.45}}
/* 丼の一枚。真上から。黒地なので縁を切らず、左に寄せて置く */
.don{margin:clamp(22px,6vw,34px) 0 0;max-width:30rem}
.don img{width:100%;aspect-ratio:1/1;object-fit:cover}
.mise{margin:0 0 clamp(16px,4vw,22px)}
.kiosk-photo{margin:clamp(14px,4vw,20px) 0}
.kiosk-photo img{width:100%;aspect-ratio:3/2;object-fit:cover}
.mise img{width:100%;aspect-ratio:4/3;object-fit:cover}
@media (prefers-reduced-motion:no-preference){
  .don img{animation:press .8s cubic-bezier(.22,1,.36,1) both}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

function state(){
  const d=new Date(), w=d.getDay();
  if(SHUT.indexOf(w)>=0) return "rest";
  const m=d.getHours()*60+d.getMinutes();
  return (m>=OPEN_MIN && m<CLOSE_MIN) ? "open" : "shut";
}

function build(t){
  const st=document.getElementById("steps"); st.textContent="";
  for(const k of STEPS){
    const li=el("li");
    li.appendChild(el("b",null,t[k]));
    li.appendChild(el("p",null,t[k+"_n"]));
    st.appendChild(li);
  }

  const bl=document.getElementById("bowls"); bl.textContent="";
  for(const b of BOWLS){
    const li=el("li","bowl");
    li.appendChild(el("span","bw-n",t[b.id]));
    li.appendChild(el("span","bw-y","¥"+b.y));
    li.appendChild(el("span","bw-d",t[b.id+"_d"]));
    const tg=el("div","bw-t");
    for(const k of b.t){ const s=el("span",k==="pork"?"pork":null,t["t_"+k]); tg.appendChild(s); }
    li.appendChild(tg);
    bl.appendChild(li);
  }

  const sz=document.getElementById("sizes"); sz.textContent="";
  for(const s of SIZES){
    const li=el("li");
    li.appendChild(el("b",null,t[s.id]));
    const bar=el("div","bar"); const i=el("i"); i.style.width=s.w+"%"; i.style.setProperty("--w",s.w+"%");
    bar.appendChild(i); li.appendChild(bar);
    li.appendChild(el("small",null,t[s.id+"_v"]));
    sz.appendChild(li);
  }

  const ru=document.getElementById("rules"); ru.textContent="";
  for(const u of RULES){
    const li=el("li");
    li.appendChild(el("b",null,t[u]));
    li.appendChild(el("p",null,t[u+"_n"]));
    ru.appendChild(li);
  }

  const rw=document.getElementById("rows"); rw.textContent="";
  for(const k of ROWS){ rw.appendChild(el("dt",null,t[k])); rw.appendChild(el("dd",null,t[k+"_v"])); }
}

function apply(code){
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){ const v=t[n.dataset.k]; if(v!=null) n.textContent=v; }
  build(t);
  const s=state(), box=document.getElementById("open");
  box.dataset.open=String(s==="open");
  box.textContent = s==="open"?t.s_open:(s==="rest"?t.s_rest:t.s_shut);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#lb button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title=t.name1+" "+t.name2;
}

const lb=document.getElementById("lb");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code));
  lb.appendChild(b);
}
apply("ja");
</script>

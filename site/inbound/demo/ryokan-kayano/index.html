<style>
/* 旅館は一泊の時間割そのもの。だから時刻を背骨にして、縦の線に沿って出来事を並べる。
   外の人がいちばん戸惑うのは、何時に何が起きるか。部屋の写真より先にそれを置く。
   色は古材の暗い茶と障子の白の二色だけ。差し色は使わない。
   動きは、時間の線が上から下へ引かれること。 */
:root{
  --wood:#201c18;
  --wood-2:#2b2621;
  --shoji:#efeae1;
  --shoji-2:#b9b1a5;
  --shoji-3:#7d756a;
  --line:#3a342d;
  --f-ser:"Noto Serif JP",ui-serif,Georgia,serif;
  --f-jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gl:max(22px,env(safe-area-inset-left,0px));
  --gr:max(22px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wood);color:var(--shoji);font-family:var(--f-jp);
  font-size:15px;line-height:1.95;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.c{max-width:46rem;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

.lang{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(32,28,24,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:21;background:var(--wood)}
.lang .c{display:flex;gap:18px;padding-top:13px;padding-bottom:13px;overflow-x:auto;scrollbar-width:none}
.lang .c::-webkit-scrollbar{display:none}
.lang button{flex:none;padding:0;background:none;border:0;color:var(--shoji-3);
  font:400 12.5px/1.6 var(--f-jp);cursor:pointer;white-space:nowrap;transition:color .25s}
.lang button:hover{color:var(--shoji)}
.lang button[aria-pressed="true"]{color:var(--shoji)}

.gate{padding:clamp(40px,12vw,84px) 0 clamp(30px,7vw,46px)}
.vill{margin:0;font-size:12px;letter-spacing:.24em;color:var(--shoji-3)}
.inn{margin:18px 0 0;font-family:var(--f-ser);font-weight:400;font-size:clamp(38px,11vw,62px);
  line-height:1.2;letter-spacing:.08em}
.inn small{display:block;margin-top:.7em;font-family:var(--f-jp);font-size:13px;font-weight:400;
  letter-spacing:.16em;color:var(--shoji-3)}
.lede{margin:26px 0 0;max-width:28em;font-size:15px;line-height:2.1;color:var(--shoji-2)}

/* 一泊の時間割。これがこのページの背骨 */
.day{position:relative;margin:clamp(40px,10vw,68px) 0 0;padding:0 0 0 clamp(62px,17vw,78px);list-style:none}
.day::before{content:"";position:absolute;left:clamp(53px,14.6vw,66px);top:.9em;bottom:1.4em;width:1px;
  background:var(--line);transform-origin:top center}
.day li{position:relative;padding:0 0 clamp(26px,6vw,34px)}
.day li:last-child{padding-bottom:0}
.day .hh{position:absolute;left:calc(clamp(62px,17vw,78px) * -1);top:-.12em;width:clamp(46px,12.4vw,56px);
  font-family:var(--f-ser);font-weight:300;font-size:clamp(19px,5vw,23px);line-height:1.3;
  letter-spacing:.02em;text-align:right;color:var(--shoji)}
.day li::after{content:"";position:absolute;left:calc(clamp(9px,2.4vw,12px) * -1);top:.62em;
  width:7px;height:7px;border-radius:50%;background:var(--shoji-3)}
.day li[data-key="1"]::after{background:var(--shoji);box-shadow:0 0 0 4px rgba(239,234,225,.12)}
.day b{display:block;font-size:16.5px;font-weight:500;line-height:1.7}
.day p{margin:4px 0 0;font-size:13.5px;line-height:2;color:var(--shoji-2)}

/* 部屋。間取りを線で描く。写真の代わりに広さと造りを見せる */
.rooms{margin:0;padding:0;list-style:none}
.room{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;
  padding:clamp(22px,5vw,28px) 0;border-top:1px solid var(--line)}
.room:last-child{border-bottom:1px solid var(--line)}
.rm-n{grid-column:1;font-family:var(--f-ser);font-weight:400;font-size:19px;line-height:1.5;letter-spacing:.04em}
.rm-b{grid-column:1;font-size:13.5px;line-height:1.95;color:var(--shoji-2)}
.rm-p{grid-column:2;grid-row:1 / span 2;text-align:right;white-space:nowrap}
.rm-p b{display:block;font-family:var(--f-ser);font-weight:600;font-size:20px;line-height:1.3;letter-spacing:.01em}
.rm-p span{display:block;font-size:11.5px;line-height:1.8;color:var(--shoji-3)}
.plan{grid-column:1 / -1;margin-top:12px}
.plan svg{display:block;width:100%;max-width:230px;height:auto}
.plan .wl{fill:none;stroke:var(--shoji-3);stroke-width:1.3}
.plan .tm{fill:none;stroke:var(--line);stroke-width:1}
.plan text{font:400 8.5px var(--f-jp);fill:var(--shoji-3)}

.part{margin-top:clamp(44px,10vw,72px)}
.part h2{margin:0 0 clamp(16px,3.6vw,22px);font-family:var(--f-ser);font-weight:400;
  font-size:clamp(20px,5vw,26px);line-height:1.6;letter-spacing:.06em}
.part > p{margin:0 0 clamp(16px,3.4vw,22px);max-width:32em;font-size:14px;line-height:2.05;color:var(--shoji-2)}

.rows{display:grid;grid-template-columns:7rem minmax(0,1fr);margin:0;font-size:14px}
.rows dt{padding:10px 0;border-top:1px solid var(--line);color:var(--shoji-3);font-size:12.5px;line-height:1.9}
.rows dd{margin:0;padding:10px 0;border-top:1px solid var(--line);line-height:1.9}
.rows dt:first-of-type,.rows dt:first-of-type + dd{border-top:0}
@media (max-width:450px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-bottom:0;border-top:1px solid var(--line)}
  .rows dd{padding-top:0;border-top:0}
  .rows dt:first-of-type{border-top:0}
}

/* 宿のきまり。守ってほしいことは囲まずに、字下げで示す */
.rules{margin:0;padding:0;list-style:none}
.rules li{padding:clamp(12px,2.8vw,16px) 0 clamp(12px,2.8vw,16px) 18px;
  border-left:1px solid var(--line);margin-left:2px}
.rules b{display:block;font-size:15px;font-weight:500;line-height:1.7}
.rules p{margin:2px 0 0;font-size:13.5px;line-height:1.95;color:var(--shoji-2)}

.book{display:inline-block;margin-top:22px;padding:14px 26px;background:var(--shoji);color:var(--wood);
  font-size:14.5px;font-weight:500;text-decoration:none;transition:opacity .25s}
.book:hover{opacity:.8}
.book-n{margin:12px 0 0;font-size:12.5px;line-height:1.9;color:var(--shoji-3)}

.end{margin-top:clamp(44px,10vw,70px);padding:clamp(22px,5vw,28px) 0
  calc(clamp(30px,7vw,46px) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.end b{display:block;font-size:11px;letter-spacing:.2em;color:var(--shoji-3)}
.end p{margin:8px 0 0;font-size:12.5px;line-height:1.9;color:var(--shoji-3)}

:focus-visible{outline:2px solid var(--shoji);outline-offset:3px}

/* ── 動き：時間の線が上から引かれ、間取りの壁が描かれる ── */
@media (prefers-reduced-motion:no-preference){
  .day::before{animation:fall 1.3s cubic-bezier(.22,1,.36,1) both}
  .inn,.lede{animation:soft 1s ease both}
  .lede{animation-delay:.15s}
  .plan .wl{stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400);
    animation:draw 1.2s cubic-bezier(.3,1,.4,1) forwards}
  @supports (animation-timeline:view()){
    .day li{animation:soft .01s linear both;animation-timeline:view();animation-range:entry 0 entry 200px}
    .plan .wl{animation-timeline:view();animation-range:entry 0 entry 280px;animation-duration:1ms}
  }
}
@keyframes fall{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes soft{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
</style>

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

function build(t){
  const dy=document.getElementById("day"); dy.textContent="";
  for(const d of DAY){
    const li=el("li"); if(d.key) li.dataset.key="1";
    li.appendChild(el("span","hh",d.t));
    li.appendChild(el("b",null,t[d.k]));
    li.appendChild(el("p",null,t[d.k+"_n"]));
    dy.appendChild(li);
  }

  const rm=document.getElementById("rooms"); rm.textContent="";
  for(const r of ROOMS){
    const li=el("li","room");
    li.appendChild(el("p","rm-n",t[r.id]));
    li.appendChild(el("p","rm-b",t[r.id+"_b"]));
    const pr=el("div","rm-p");
    pr.appendChild(el("b",null,"¥"+r.p));
    pr.appendChild(el("span",null,t.per));
    li.appendChild(pr);
    const pl=el("div","plan"); pl.innerHTML=PLANS[r.pl];
    li.appendChild(pl);
    rm.appendChild(li);
  }
  for(const p of document.querySelectorAll(".plan .wl")){
    try{ p.style.setProperty("--len", Math.ceil(p.getTotalLength())); }catch(e){}
  }

  for(const [id,keys] of [["meal",MEAL],["visit",VISIT]]){
    const dl=document.getElementById(id); dl.textContent="";
    for(const k of keys){ dl.appendChild(el("dt",null,t[k])); dl.appendChild(el("dd",null,t[k+"_v"])); }
  }

  const ru=document.getElementById("rules"); ru.textContent="";
  for(const u of RULES){
    const li=el("li");
    li.appendChild(el("b",null,t[u]));
    li.appendChild(el("p",null,t[u+"_n"]));
    ru.appendChild(li);
  }
}

function apply(code){
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){ const v=t[n.dataset.k]; if(v!=null) n.textContent=v; }
  build(t);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#lb button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title=t.name;
}

const lb=document.getElementById("lb");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code));
  lb.appendChild(b);
}
apply("ja");
</script>

<style>
/* 美容室で外の人が不安なのは「言葉が通じないまま切られること」。
   だから料金より先に、どう伝えるかを置く。指差しできる長さの図を主役にした。
   色は鏡の灰白と黒だけ。ピンクも飾りも使わない。
   文字は細く大きく、行間を広く。動きは、鏡を拭くように横から現れること。 */
:root{
  --mirror:#f6f6f7;
  --mirror-2:#e9e9ec;
  --ink:#1a1a1d;
  --ink-2:#55555b;
  --ink-3:#6e6e76;
  --hair:#d9d9de;
  --f-jo:"Jost",ui-sans-serif,system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gl:max(20px,env(safe-area-inset-left,0px));
  --gr:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mirror);color:var(--ink);font-family:var(--f-jp);
  font-size:15px;line-height:2;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
.c{max-width:48rem;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

.lang{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--mirror)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:31;background:var(--mirror)}
.lang .c{display:flex;justify-content:center;gap:clamp(12px,4vw,26px);padding-top:14px;padding-bottom:14px;
  overflow-x:auto;scrollbar-width:none}
.lang .c::-webkit-scrollbar{display:none}
.lang button{flex:none;padding:0;background:none;border:0;color:var(--ink-3);
  font:400 11.5px/1.6 var(--f-jo);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  white-space:nowrap;transition:color .25s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom:1px solid var(--ink)}

/* 扉。細い欧文を大きく、和文は小さく添える */
.door{padding:clamp(40px,12vw,84px) 0 clamp(28px,6vw,40px)}
.sign{margin:0;font-family:var(--f-jo);font-weight:300;font-size:clamp(50px,17vw,108px);
  line-height:.92;letter-spacing:.06em}
.where{margin:16px 0 0;font-size:12px;letter-spacing:.14em;color:var(--ink-3)}
.say{margin:22px 0 0;max-width:27em;font-size:14.5px;line-height:2.1;color:var(--ink-2)}

/* 言葉。このページの最初の節。料金より前に置く */
.talk{margin:clamp(32px,8vw,52px) 0 0;padding:clamp(22px,5vw,32px) 0;
  border-top:1px solid var(--ink);border-bottom:1px solid var(--hair)}
.talk h2{margin:0 0 14px;font-size:clamp(18px,4.6vw,23px);font-weight:500;line-height:1.6}
.talk p{margin:0;max-width:30em;font-size:14px;line-height:2.05;color:var(--ink-2)}
.talk p + p{margin-top:10px}

/* 長さの図。指差して伝えるためのもの */
.lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(50%,7rem),1fr));
  gap:clamp(12px,3vw,20px);margin:clamp(22px,5vw,30px) 0 0}
.len{text-align:center}
.len svg{display:block;width:100%;max-width:92px;margin:0 auto 8px;height:auto}
.len .hd{fill:var(--mirror-2);stroke:var(--ink);stroke-width:1.4}
.len .hr{fill:var(--ink);opacity:.86}
.len .ln{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.len b{display:block;font-size:14px;font-weight:500;line-height:1.6}
.len span{display:block;font:400 11px/1.7 var(--f-jo);letter-spacing:.08em;color:var(--ink-3)}

.sec{margin-top:clamp(38px,9vw,62px)}
.sec h2{margin:0 0 clamp(14px,3.2vw,20px);font-size:clamp(18px,4.6vw,23px);font-weight:500;line-height:1.6}
.sec > p{margin:0 0 clamp(14px,3.2vw,20px);max-width:32em;font-size:14px;line-height:2.05;color:var(--ink-2)}

/* 料金。細い行、値段は右 */
.menu{margin:0;padding:0;list-style:none}
.menu li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;
  padding:clamp(13px,3vw,17px) 0;border-bottom:1px solid var(--hair)}
.menu li:first-child{border-top:1px solid var(--hair)}
.mn-n{grid-column:1;font-size:15.5px;font-weight:500;line-height:1.6}
.mn-d{grid-column:1;font-size:12.5px;line-height:1.85;color:var(--ink-3)}
.mn-y{grid-column:2;grid-row:1 / span 2;text-align:right;white-space:nowrap}
.mn-y b{display:block;font:400 19px/1.3 var(--f-jo);letter-spacing:.02em}
.mn-y span{display:block;font:400 11px/1.6 var(--f-jo);letter-spacing:.06em;color:var(--ink-3)}

/* 担当者。名前と、話せることば */
.staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));
  gap:clamp(16px,3.6vw,26px)}
.st{min-width:0;padding-top:14px;border-top:1px solid var(--ink)}
.st b{display:block;font:400 19px/1.4 var(--f-jo);letter-spacing:.03em}
.st em{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
.st p{margin:8px 0 0;font-size:13px;line-height:1.95;color:var(--ink-2)}
.st ul{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0;padding:0;list-style:none}
.st li{padding:2px 8px;background:var(--mirror-2);font:400 11px/1.7 var(--f-jo);letter-spacing:.05em}

.rules{margin:0;padding:0;list-style:none}
.rules li{padding:clamp(11px,2.6vw,15px) 0;border-bottom:1px solid var(--hair)}
.rules b{display:block;font-size:14.5px;font-weight:500;line-height:1.7}
.rules p{margin:2px 0 0;font-size:13px;line-height:1.95;color:var(--ink-2)}

.rows{display:grid;grid-template-columns:6rem minmax(0,1fr);margin:0;font-size:14px}
.rows dt{padding:9px 0;border-top:1px solid var(--hair);color:var(--ink-3);font-size:12.5px;line-height:1.9}
.rows dd{margin:0;padding:9px 0;border-top:1px solid var(--hair);line-height:1.9}
.rows dt:first-of-type,.rows dt:first-of-type + dd{border-top:0}
@media (max-width:440px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-bottom:0;border-top:1px solid var(--hair)}
  .rows dd{padding-top:0;border-top:0}
  .rows dt:first-of-type{border-top:0}
}
.go{display:inline-block;margin-top:22px;padding:14px 30px;border:1px solid var(--ink);color:var(--ink);
  font:400 13px/1 var(--f-jo);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
  transition:background-color .3s,color .3s}
.go:hover{background:var(--ink);color:var(--mirror)}
.go-n{margin:12px 0 0;font-size:12.5px;line-height:1.9;color:var(--ink-3)}

.end{margin-top:clamp(40px,9vw,64px);padding:clamp(20px,5vw,26px) 0
  calc(clamp(28px,7vw,44px) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair)}
.end b{display:block;font:400 11px/1.9 var(--f-jo);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.end p{margin:6px 0 0;font-size:12.5px;line-height:1.9;color:var(--ink-3)}

:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── 動き：鏡を拭くように、左から現れる。上下には動かさない ── */
@media (prefers-reduced-motion:no-preference){
  .sign,.where,.say{animation:wipe 1s cubic-bezier(.3,1,.4,1) both}
  .where{animation-delay:.1s}.say{animation-delay:.18s}
  @supports (animation-timeline:view()){
    .len,.menu li,.st,.rules li{animation:wipe .01s linear both;animation-timeline:view();
      animation-range:entry 10px entry 170px}
  }
}
@keyframes wipe{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
/* 店内。鏡の列。硬い光のモノクロ写真を、見出しのすぐ下に置く */
.mise{margin:clamp(22px,6vw,34px) 0 0}
.mise img{width:100%;aspect-ratio:3/2;max-height:58vh;object-fit:cover;background:var(--mirror)}
@media (min-width:760px){.mise img{aspect-ratio:2/1}}
@media (prefers-reduced-motion:no-preference){
  .mise img{animation:wipe 1s cubic-bezier(.22,1,.36,1) both}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
/* 髪の長さの図。下端 y だけ変えて4枚描く */
function head(y){
  return '<svg viewBox="0 0 80 110" aria-hidden="true">'+
    '<path class="hr" d="M22 34c0-11 8-19 18-19s18 8 18 19v'+(y-34)+'c0 3-2 5-5 5h-26c-3 0-5-2-5-5z"/>'+
    '<circle class="hd" cx="40" cy="36" r="13"/>'+
    '<path class="hd" d="M31 48h18l4 14H27z"/>'+
    '<path class="ln" d="M14 '+y+'h52"/>'+
    '</svg>';
}

function state(){
  const d=new Date(), w=d.getDay();
  if(SHUT.indexOf(w)>=0) return "rest";
  const m=d.getHours()*60+d.getMinutes();
  return (m>=OPEN_MIN && m<CLOSE_MIN) ? "open" : "shut";
}

function build(t){
  const ln=document.getElementById("lens"); ln.textContent="";
  for(const h of HEADS){
    const d=el("div","len");
    d.innerHTML=head(h.y);
    d.appendChild(el("b",null,t[h.id]));
    d.appendChild(el("span",null,t[h.id+"_s"]));
    ln.appendChild(d);
  }

  const mu=document.getElementById("menu"); mu.textContent="";
  for(const m of MENU){
    const li=el("li");
    li.appendChild(el("span","mn-n",t[m.id]));
    const y=el("div","mn-y");
    y.appendChild(el("b",null,"¥"+m.y));
    y.appendChild(el("span",null,m.t+" "+t.min));
    li.appendChild(y);
    if(t[m.id+"_d"]) li.appendChild(el("span","mn-d",t[m.id+"_d"]));
    mu.appendChild(li);
  }

  const sf=document.getElementById("staff"); sf.textContent="";
  for(const p of STAFF){
    const d=el("div","st");
    d.appendChild(el("b",null,t[p.id]));
    d.appendChild(el("em",null,t[p.id+"_r"]));
    d.appendChild(el("p",null,t[p.id+"_n"]));
    const ul=el("ul");
    for(const g of p.lg) ul.appendChild(el("li",null,g));
    d.appendChild(ul);
    sf.appendChild(d);
  }

  const ru=document.getElementById("rules"); ru.textContent="";
  for(const u of RULES){
    const li=el("li");
    li.appendChild(el("b",null,t[u]));
    li.appendChild(el("p",null,t[u+"_n"]));
    ru.appendChild(li);
  }

  const rw=document.getElementById("rows"); rw.textContent="";
  for(const k of ROWS){ rw.appendChild(el("dt",null,t[k])); rw.appendChild(el("dd",null,t[k+"_v"])); }
}

function apply(code){
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){ const v=t[n.dataset.k]; if(v!=null) n.textContent=v; }
  build(t);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#lb button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title="KUON";
}

const lb=document.getElementById("lb");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code));
  lb.appendChild(b);
}
apply("ja");
</script>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="yama × yama. が多言語ページの見本として作った、架空のお店「湯波茶屋 すぎもと」のデモサイトです。実在の店舗ではありません。">
<meta name="theme-color" content="#f4f1e9">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>湯波茶屋すぎもと</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* スマホ前提の一本スクロール。杉の黒・和紙の生成り・苔色。写真で食欲を、文字は静かに、操作は親指の届く下端に。 */
:root{
  --paper:#f4f1e9; --card:#fffdf8; --ink:#1b1915; --sub:#625b4f; --faint:#8a8274;
  --line:#e2dacb; --moss:#3f6238; --moss-ink:#2d4728; --moss-wash:#e9efe4;
  --lacquer:#9a3a2b; --lacquer-wash:#f6e7e2; --gold:#9a7a3e;
  --shadow:0 1px 2px rgba(27,25,21,.05),0 10px 28px -16px rgba(27,25,21,.22);
  --font-display:"Shippori Mincho",ui-serif,Georgia,"Times New Roman",serif;
  --font-body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --gutter-l:max(18px,env(safe-area-inset-left,0px));
  --gutter-r:max(18px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141318; --card:#1d1c23; --ink:#efeae0; --sub:#b0a898; --faint:#857e70;
  --line:#2f2d36; --moss:#9fc490; --moss-ink:#c6dcba; --moss-wash:#1e281c;
  --lacquer:#e39a8d; --lacquer-wash:#2e1f1c; --gold:#d0b07a;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -16px rgba(0,0,0,.75); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#141318; --card:#1d1c23; --ink:#efeae0; --sub:#b0a898; --faint:#857e70;
  --line:#2f2d36; --moss:#9fc490; --moss-ink:#c6dcba; --moss-wash:#1e281c;
  --lacquer:#e39a8d; --lacquer-wash:#2e1f1c; --gold:#d0b07a;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -16px rgba(0,0,0,.75); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;
  line-height:1.8;margin:0;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:44rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}

/* ── 言語バー ─────────────────────────── */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:41;background:var(--paper)}
.langbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.langbar .wrap{display:flex;align-items:center;gap:.75rem;padding-block:.45rem}
.mark{display:none;font-family:var(--font-display);font-weight:800;font-size:.95rem;
  letter-spacing:.06em;white-space:nowrap}
@media (min-width:560px){.mark{display:block}}
.langs{display:flex;gap:.25rem;margin-left:auto;margin-right:auto;flex-wrap:nowrap}
@media (min-width:560px){.langs{margin-right:0}}
.langs button{font:500 .82rem/1 var(--font-body);color:var(--sub);background:none;
  border:1px solid transparent;border-radius:999px;padding:.55rem .7rem;min-height:2.25rem;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--card);background:var(--moss);border-color:var(--moss)}
.langs button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}

/* ── ヒーロー（写真が埋めるのでセーフエリアの食い込みはしない） ── */
.hero{position:relative;isolation:isolate;height:min(64svh,520px);min-height:22rem;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 55%}
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to top,rgba(12,10,8,.9) 0%,rgba(12,10,8,.6) 34%,rgba(12,10,8,.12) 64%,rgba(12,10,8,0) 100%)}
.hero-body{position:absolute;inset:auto 0 0 0;z-index:2;padding-block:0 1.5rem}
.kicker{font:500 .7rem/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase;
  color:#e2d8bd;margin:0 0 .6rem}
.hero h1{font-family:var(--font-display);font-weight:800;color:#fcfaf4;
  font-size:clamp(2.1rem,10vw,3.3rem);line-height:1.15;margin:0 0 .5rem;text-wrap:balance;
  text-shadow:0 2px 18px rgba(0,0,0,.45)}
.hero-tag{color:#ebe4d4;margin:0;font-size:.92rem;line-height:1.7;max-width:30rem}
.status{display:inline-flex;align-items:center;gap:.45rem;font:700 .76rem/1 var(--font-body);
  border-radius:999px;padding:.45rem .75rem;margin:0 0 .75rem;
  background:rgba(252,250,244,.16);color:#fcfaf4;border:1px solid rgba(252,250,244,.32);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.status .dot{width:.5rem;height:.5rem;border-radius:50%;background:#8fd07c;box-shadow:0 0 0 3px rgba(143,208,124,.25)}
.status[data-open="false"] .dot{background:#e8a596;box-shadow:0 0 0 3px rgba(232,165,150,.22)}

/* 早見の帯 */
.quick{background:var(--card);border-bottom:1px solid var(--line)}
.quick .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-block:.85rem}
.q{padding-inline:.25rem;text-align:center;min-width:0}
.q + .q{border-left:1px solid var(--line)}
.q b{display:block;font-family:var(--font-display);font-weight:600;font-size:1rem;line-height:1.35;
  font-variant-numeric:tabular-nums}
.q span{display:block;font-size:.7rem;color:var(--faint);letter-spacing:.04em;line-height:1.5;margin-top:.15rem}

/* ── 共通 ─────────────────────────────── */
section{padding-block:2.75rem}
section + section{border-top:1px solid var(--line)}
.eyebrow{font:500 .68rem/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin:0 0 .55rem}
h2{font-family:var(--font-display);font-weight:600;font-size:1.6rem;line-height:1.35;margin:0 0 .5rem}
.lede{color:var(--sub);margin:0 0 1.5rem;font-size:.95rem}

/* ── 写真の帯 ─────────────────────────── */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:.7rem;overflow-x:auto;
  scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:1.5rem;
  margin-inline:calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r));
  padding-inline:var(--gutter-l) var(--gutter-r);scroll-padding-inline:var(--gutter-l)}
.strip::-webkit-scrollbar{display:none}
.strip figure{margin:0;scroll-snap-align:start;min-width:0}
.strip img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.6rem;box-shadow:var(--shadow)}
.strip figcaption{font-size:.76rem;color:var(--faint);margin-top:.45rem}
@media (min-width:640px){.strip{grid-auto-columns:1fr;overflow:visible;margin-inline:0;padding-inline:0}}

/* ── 品書き ───────────────────────────── */
.menu{display:grid;gap:1rem}
@media (min-width:640px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dish{background:var(--card);border:1px solid var(--line);border-radius:.7rem;overflow:hidden;
  box-shadow:var(--shadow);min-width:0}
.dish img{width:100%;aspect-ratio:3/2;object-fit:cover}
.dish-body{padding:.95rem 1rem 1.05rem}
.dish-top{display:flex;gap:.75rem;align-items:baseline}
.dish-name{font-family:var(--font-display);font-weight:600;font-size:1.15rem;line-height:1.4;flex:1;min-width:0}
.price{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700;font-size:1.02rem;color:var(--moss-ink)}
.dish-note{color:var(--sub);font-size:.88rem;line-height:1.7;margin:.3rem 0 0}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.65rem}
.tag{font:500 .72rem/1 var(--font-body);border-radius:999px;padding:.32rem .6rem}
.tag.veg{color:var(--moss-ink);background:var(--moss-wash)}
.tag.raw{color:var(--lacquer);background:var(--lacquer-wash)}

/* ── アレルギー（スマホでは表より札の方が読める） ── */
.allergens{display:grid;gap:.6rem}
.al{display:flex;gap:.9rem;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:.6rem;padding:.75rem .85rem;min-width:0}
.al img{width:3.25rem;height:3.25rem;object-fit:cover;border-radius:.4rem;flex:0 0 3.25rem}
.al-main{flex:1;min-width:0}
.al-name{font-weight:700;font-size:.95rem;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.chip{font:700 .74rem/1 var(--font-body);color:var(--lacquer);background:var(--lacquer-wash);
  border-radius:.3rem;padding:.3rem .5rem}
.chip.none{color:var(--moss-ink);background:var(--moss-wash);font-weight:500}
.al-key{font-size:.78rem;color:var(--faint);margin-top:.8rem}

.note{background:var(--moss-wash);border-radius:.65rem;padding:1.05rem 1.1rem;font-size:.92rem;
  line-height:1.85;margin-top:1.25rem;border:1px solid color-mix(in srgb,var(--moss) 20%,transparent)}
.note strong{display:block;font-family:var(--font-display);font-size:1.05rem;color:var(--moss-ink);margin-bottom:.3rem}

/* ── 支払い ───────────────────────────── */
.pay{display:grid;gap:.5rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.pay-item{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.8rem .85rem;min-width:0}
.pay-item b{display:block;font-size:.88rem;line-height:1.45}
.pay-item small{display:block;color:var(--faint);font-size:.74rem;line-height:1.45;margin-top:.15rem}
.pay-state{display:inline-block;font:700 .72rem/1 var(--font-body);border-radius:999px;padding:.3rem .55rem;margin-top:.55rem}
.pay-state.ok{color:var(--moss-ink);background:var(--moss-wash)}
.pay-state.ng{color:var(--lacquer);background:var(--lacquer-wash)}

/* ── 来店情報 ─────────────────────────── */
.visit{background:var(--card);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--shadow);margin:0}
.row{padding:.85rem 1rem;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row dt{color:var(--faint);font-size:.74rem;letter-spacing:.06em;margin:0 0 .15rem}
.row dd{margin:0;font-size:.95rem;line-height:1.7}
@media (min-width:560px){.row{display:flex;gap:1rem}.row dt{flex:0 0 7rem;margin:0;padding-top:.2rem}.row dd{flex:1;min-width:0}}
.tel{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;letter-spacing:.04em;-webkit-user-select:all;user-select:all}

footer{padding-block:2.25rem 2.5rem;color:var(--faint);font-size:.8rem;border-top:1px solid var(--line)}
.demo-badge{background:var(--lacquer);color:var(--card);font:700 .7rem/1 var(--font-body);letter-spacing:.06em;
  border-radius:.25rem;padding:.32rem .55rem;display:inline-block;margin-bottom:.7rem}

/* ── 下端の操作バー（スマホのみ） ─────── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:.6rem var(--gutter-r) calc(.6rem + env(safe-area-inset-bottom,0px)) var(--gutter-l);
  display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.4rem;text-align:center;white-space:nowrap;overflow:hidden;
  font:700 .92rem/1.2 var(--font-body);border-radius:.55rem;min-height:3rem;padding:.6rem .8rem;
  cursor:pointer;border:1px solid var(--moss);text-decoration:none}
.btn-fill{background:var(--moss);color:var(--card)}
.btn-line{background:var(--card);color:var(--moss-ink)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{width:1.05rem;height:1.05rem;flex:0 0 auto}
body{padding-bottom:calc(4.5rem + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){
  .dock{position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;
    padding:1rem 0 0;max-width:44rem;margin:0 auto}
  body{padding-bottom:0}
}
@media (prefers-reduced-motion:no-preference){
  .langs button{transition:background .18s,color .18s}
  .btn{transition:transform .12s}
  .btn:active{transform:scale(.98)}
}
</style>
</head>
<body>

<nav class="langbar" aria-label="Language">
  <div class="wrap">
    <span class="mark" data-k="name"></span>
    <div class="langs" id="langbar"></div>
  </div>
</nav>

<header class="hero">
  <img src="img/07-exterior-front.webp" alt="" width="1536" height="1024" fetchpriority="high" decoding="async">
  <div class="hero-body">
    <div class="wrap">
      <p class="kicker" data-k="kicker"></p>
      <p class="status" id="status" data-open="true"><span class="dot"></span><span id="status-text"></span></p>
      <h1 data-k="name"></h1>
      <p class="hero-tag" data-k="tagline"></p>
    </div>
  </div>
</header>

<div class="quick">
  <div class="wrap">
    <div class="q"><b>11:00–15:00</b><span data-k="q_hours"></span></div>
    <div class="q"><b data-k="q_closed_v"></b><span data-k="q_closed"></span></div>
    <div class="q"><b data-k="q_walk_v"></b><span data-k="q_walk"></span></div>
  </div>
</div>

<main>
  <section>
    <div class="wrap">
      <p class="eyebrow">What is yuba</p>
      <h2 data-k="h_about"></h2>
      <p class="lede" data-k="about"></p>
      <div class="strip">
        <figure><img src="img/02-interior.webp" alt="" width="1448" height="1086" loading="lazy" decoding="async"><figcaption data-k="cap_in"></figcaption></figure>
        <figure><img src="img/01-exterior.webp" alt="" width="1672" height="941" loading="lazy" decoding="async"><figcaption data-k="cap_out"></figcaption></figure>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow">Menu</p>
      <h2 data-k="h_menu"></h2>
      <p class="lede" data-k="menu_lede"></p>
      <div class="menu" id="menu"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow">Allergens &amp; diet</p>
      <h2 data-k="h_diet"></h2>
      <p class="lede" data-k="diet_lede"></p>
      <div class="allergens" id="allergen"></div>
      <p class="al-key" data-k="al_key"></p>
      <div class="note">
        <strong data-k="diet_note_t"></strong>
        <span data-k="diet_note_b"></span>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow">Payment</p>
      <h2 data-k="h_pay"></h2>
      <p class="lede" data-k="pay_lede"></p>
      <div class="pay" id="pay"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <p class="eyebrow">Visit</p>
      <h2 data-k="h_visit"></h2>
      <dl class="visit">
        <div class="row"><dt data-k="l_hours"></dt><dd data-k="v_hours"></dd></div>
        <div class="row"><dt data-k="l_closed"></dt><dd data-k="v_closed"></dd></div>
        <div class="row"><dt data-k="l_access"></dt><dd data-k="v_access"></dd></div>
        <div class="row"><dt data-k="l_seats"></dt><dd data-k="v_seats"></dd></div>
        <div class="row"><dt data-k="l_resv"></dt><dd data-k="v_resv"></dd></div>
        <div class="row"><dt data-k="l_addr"></dt><dd data-k="v_addr"></dd></div>
        <div class="row"><dt data-k="l_tel"></dt><dd><span class="tel">0288-00-0000</span></dd></div>
      </dl>
    </div>
  </section>
</main>

<div class="dock">
  <a class="btn btn-fill" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%97%A5%E5%85%89%E6%9D%B1%E7%85%A7%E5%AE%AE" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span data-k="cta_map"></span>
  </a>
  <button class="btn btn-line" id="copy" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    <span id="copy-label" data-k="cta_copy"></span>
  </button>
</div>

<footer>
  <div class="wrap">
    <span class="demo-badge" data-k="demo"></span>
    <p style="margin:0" data-k="foot"></p>
  </div>
</footer>

let current = "ja";
function el(tag, cls, text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;}
function img(src, cls){const i=document.createElement("img"); i.src=src; i.alt=""; i.loading="lazy"; i.decoding="async"; i.width=1448; i.height=1086; if(cls)i.className=cls; return i;}

/* 日本時間での営業状態。水曜定休、11:00–15:00。 */
function openState(){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  const p=Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  const m=parseInt(p.hour,10)*60+parseInt(p.minute,10);
  if(p.weekday==="Wed") return "closedday";
  return (m>=660 && m<900) ? "open" : "closed";
}

function render(t){
  const menu=document.getElementById("menu"); menu.textContent="";
  for(const d of MENU){
    const card=el("article","dish");
    card.appendChild(img(d.img));
    const body=el("div","dish-body");
    const top=el("div","dish-top");
    top.appendChild(el("h3","dish-name",t[d.id]));
    top.appendChild(el("span","price",d.price));
    body.appendChild(top);
    body.appendChild(el("p","dish-note",t[d.id+"_n"]));
    const tags=el("div","tags");
    for(const g of d.tags) tags.appendChild(el("span","tag "+g, g==="veg"?t.t_veg:t.t_raw));
    body.appendChild(tags);
    card.appendChild(body);
    menu.appendChild(card);
  }

  const al=document.getElementById("allergen"); al.textContent="";
  for(const d of MENU){
    const row=el("div","al");
    row.appendChild(img(d.img));
    const main=el("div","al-main");
    main.appendChild(el("div","al-name",t[d.id]));
    const chips=el("div","chips");
    const list=ALLERGEN[d.id];
    if(list.length) for(const k of list) chips.appendChild(el("span","chip",t[k]));
    else chips.appendChild(el("span","chip none",t.none));
    main.appendChild(chips);
    row.appendChild(main);
    al.appendChild(row);
  }

  const pay=document.getElementById("pay"); pay.textContent="";
  for(const p of PAY){
    const it=el("div","pay-item");
    it.appendChild(el("b",null,t[p.id]));
    it.appendChild(el("small",null,t[p.id+"_s"]));
    it.appendChild(el("span","pay-state "+(p.ok?"ok":"ng"), p.ok?t.ok:t.ng));
    pay.appendChild(it);
  }
}

function apply(code){
  current=code;
  const t=T[code];
  for(const n of document.querySelectorAll("[data-k]")){ const v=t[n.dataset.k]; if(v!=null) n.textContent=v; }
  render(t);
  const st=openState();
  document.getElementById("status").dataset.open=String(st==="open");
  document.getElementById("status-text").textContent = st==="open"?t.s_open:(st==="closedday"?t.s_closedday:t.s_closed);
  document.documentElement.lang=code;
  for(const b of document.querySelectorAll("#langbar button")) b.setAttribute("aria-pressed",String(b.dataset.lang===code));
  document.title=t.name;
}

const bar=document.getElementById("langbar");
for(const [code,label] of LANGS){
  const b=el("button",null,label); b.type="button"; b.dataset.lang=code;
  b.addEventListener("click",()=>apply(code)); bar.appendChild(b);
}

document.getElementById("copy").addEventListener("click",async ()=>{
  const num=document.querySelector(".tel").textContent;
  const label=document.getElementById("copy-label");
  try{ await navigator.clipboard.writeText(num); label.textContent=T[current].copied+"  "+num; }
  catch{ const r=document.createRange(); r.selectNodeContents(document.querySelector(".tel"));
         const s=getSelection(); s.removeAllRanges(); s.addRange(r); label.textContent=num;
         document.querySelector(".tel").scrollIntoView({block:"center"}); }
  setTimeout(()=>{ label.textContent=T[current].cta_copy; },2000);
});

apply("ja");
</script>
